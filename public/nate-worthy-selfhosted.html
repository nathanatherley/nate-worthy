      html += '<button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">\u2039</button>';
    }
    html += '<img src="' + currentSrc + '" alt="Enlarged photo, ' + (lightboxIndex + 1) + ' of ' + lightboxKeys.length + '">';
    if (lightboxKeys.length > 1) {
      html += '<button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">\u203a</button>';
      html += '<span class="lightbox-counter">' + (lightboxIndex + 1) + ' / ' + lightboxKeys.length + '</span>';
    }
    html += '</div>';
  }

  return html;
}

const ONE_YEAR_MS = 365 * 24 * 60 * 60 * 1000;

function renderTrendingCard() {
  const trending = getTrendingGroups();
  if (!trending.length) return '';

  let inner = '<p class="hint">Places 2 or more people you trust have separately vouched for recently.</p>';
  trending.forEach(t => {
    inner += '<div class="trend-row">';
    inner += '<div>';
    inner += '<p class="trend-title">' + escapeHtml(t.entry.restaurant) + '</p>';
    inner += '<p class="track-record">' + escapeHtml(t.cityName) + (t.entry.cuisine ? ' · ' + escapeHtml(t.entry.cuisine) : '') + ' · recommended by ' + t.memberNames.map(escapeHtml).join(', ') + '</p>';
    inner += '</div>';
    if (t.score !== null) {
      inner += '<span class="trend-score">' + t.score.toFixed(1) + '\u2605</span>';
    }
    inner += '</div>';
  });
  return renderCollapsibleWrapper('trending', 'Trending in your circle', inner, false, 'trending-card');
}

function renderLeaderboardCard() {
  if (!me) return '';
  const cuisines = getAvailableLeaderboardCuisines();
  if (!cuisines.length) return '';

  if (!leaderboardCuisine || !cuisines.includes(leaderboardCuisine)) {
    leaderboardCuisine = cuisines[0];
  }

  const ranked = getCuisineLeaderboard(leaderboardCuisine, 5);
  const recommenders = getTopRecommendersForCuisine(leaderboardCuisine, 5);

  let inner = '<p class="hint">Top-rated picks and top recommenders in your own trust network, by cuisine. Never ranks people outside your network, and never shows trust ratings — only their picks\' own scores.</p>';
  const VISIBLE_CUISINE_COUNT = 6;
  inner += '<div class="cuisine-chips">';
  cuisines.forEach((c, i) => {
    const isSelected = c === leaderboardCuisine;
    const hidden = i >= VISIBLE_CUISINE_COUNT && !leaderboardShowAllCuisines;
    inner += '<span class="chip' + (isSelected ? ' selected' : '') + (hidden ? ' hidden-cuisine-chip' : '') + '" data-leaderboard-cuisine="' + escapeHtml(c) + '">' + escapeHtml(c) + '</span>';
  });
  if (cuisines.length > VISIBLE_CUISINE_COUNT && !leaderboardShowAllCuisines) {
    inner += '<span class="chip more" id="leaderboard-more-chip">+' + (cuisines.length - VISIBLE_CUISINE_COUNT) + ' more</span>';
  }
  inner += '</div>';

  inner += '<div class="section-label" style="margin:16px 0 8px;">Top picks</div>';
  if (!ranked.length) {
    inner += '<p class="empty">No rated entries for this cuisine yet.</p>';
  } else {
    ranked.forEach((r, i) => {
      inner += '<div class="trend-row">';
      inner += '<div><p class="trend-title">' + (i + 1) + '. ' + escapeHtml(r.entry.restaurant) + '</p>';
      inner += '<p class="track-record">' + escapeHtml(r.cityName) + '</p></div>';
      inner += '<span class="trend-score">' + r.score.toFixed(1) + '\u2605</span>';
      inner += '</div>';
    });
  }

  inner += '<div class="section-label" style="margin:16px 0 8px;">Top recommenders in your network</div>';
  if (!recommenders.length) {
    inner += '<p class="empty">Nobody in your network has rated this cuisine yet.</p>';
  } else {
    recommenders.forEach((r, i) => {
      inner += '<div class="trend-row">';
      inner += '<div><p class="trend-title">' + (i + 1) + '. ' + escapeHtml(r.name) + '</p>';
      inner += '<p class="track-record">' + r.count + ' rated ' + (r.count === 1 ? 'pick' : 'picks') + '</p></div>';
      inner += '<span class="trend-score">' + r.score.toFixed(1) + '\u2605</span>';
      inner += '</div>';
    });
  }

  return renderCollapsibleWrapper('leaderboard', 'Leaderboard by cuisine', inner, true);
}

// "Best of the best" for a city: ranks by how many distinct trusted people
// recommended a place first, then by trust-weighted rating as the tiebreaker —
// a place two people you trust independently vouched for beats a place only
// one person rated highly, same consensus philosophy as group-pick planning.
function getBestOfBestForCity(cityId) {
  const visibleIds = visibleFriendIds();
  const cityEntries = state.suggestions.filter(s => s.cityId === cityId && visibleIds.has(s.friendId) && s.ratingTaste > 0);
  if (!cityEntries.length) return [];

  const seenGroups = new Set();
  const results = [];
  cityEntries.forEach(entry => {
    const gid = groupIdFor(entry);
    if (seenGroups.has(gid)) return;
    seenGroups.add(gid);

    const members = groupMembers(entry).filter(m => visibleIds.has(m.friendId) && m.ratingTaste > 0);
    const distinctRecommenders = new Set(members.map(m => m.friendId));
    const score = groupWeightedScore(entry);

    results.push({
      entry,
      recommenderCount: distinctRecommenders.size,
      recommenderNames: [...new Set(members.map(m => m.friendName))],
      score: score !== null ? score : 0
    });
  });

  results.sort((a, b) => {
    if (b.recommenderCount !== a.recommenderCount) return b.recommenderCount - a.recommenderCount;
    return b.score - a.score;
  });

  return results;
}

function renderBoard() {
  if (!state.cities.length) {
    return '';
  }
  const visibleIds = visibleFriendIds();
  const query = boardSearchQuery.trim().toLowerCase();
  const newSinceCount = state.suggestions.filter(s => visibleIds.has(s.friendId) && s.ts > previousVisitTs).length;
  let totalVisible = 0;
  let out = '';

  state.cities.forEach(city => {
    let entries = state.suggestions.filter(s => s.cityId === city.id && visibleIds.has(s.friendId));
    if (hideMyEntries) entries = entries.filter(e => e.friendId !== me.friendId);
    if (showOnlyNew) entries = entries.filter(e => e.ts > previousVisitTs);
    if (query) {
      entries = entries.filter(e =>
        e.restaurant.toLowerCase().includes(query) ||
        (e.cuisine || '').toLowerCase().includes(query)
      );
    }
    if (!entries.length) return;
    totalVisible += entries.length;

    const scored = entries.map(e => ({ e, record: friendTrackRecord(e.friendId, e.cuisine), weight: myTrustWeight(e.friendId) || 1 }));
    if (boardSortMode === 'recent') {
      scored.sort((a, b) => b.e.ts - a.e.ts);
    } else if (boardSortMode === 'alpha') {
      scored.sort((a, b) => a.e.restaurant.localeCompare(b.e.restaurant));
    } else {
      scored.sort((a, b) => {
        const asRaw = groupWeightedScore(a.e);
        const bsRaw = groupWeightedScore(b.e);
        const as = asRaw === null ? -1 : asRaw;
        const bs = bsRaw === null ? -1 : bsRaw;
        if (bs !== as) return bs - as;
        return b.e.ts - a.e.ts;
      });
    }

    const isCollapsed = collapsedCities.has(city.id);
    out += '<div class="postcard" data-city-id="' + city.id + '">';
    const nearbyMajor = nearbyMajorCityFor(city);
    const nearbyMajorNote = nearbyMajor ? ' <span class="near-major-city">(~' + escapeHtml(nearbyMajor) + ')</span>' : '';
    out += '<div class="postcard-head postcard-head-clickable" data-toggle-city="' + city.id + '" role="button" tabindex="0" aria-expanded="' + (!isCollapsed) + '" aria-label="' + (isCollapsed ? 'Expand' : 'Collapse') + ' ' + escapeHtml(city.name) + '"><div class="head-left"><div class="postmark">' + escapeHtml(city.name.slice(0,3).toUpperCase()) + '</div><h3>' + escapeHtml(city.name) + nearbyMajorNote + '</h3></div><span class="count">' + entries.length + ' spot' + (entries.length === 1 ? '' : 's') + ' ' + (isCollapsed ? '\u25b8' : '\u25be') + '</span></div>';

    if (!isCollapsed) {
      const bestOfBest = getBestOfBestForCity(city.id).slice(0, 3);
      if (bestOfBest.length) {
        out += '<div class="best-of-best">';
        out += '<div class="best-of-best-label">\u{1F3C6} Best of the best</div>';
        bestOfBest.forEach(b => {
          out += '<div class="trend-row">';
          out += '<div><p class="trend-title">' + escapeHtml(b.entry.restaurant) + '</p>';
          out += '<p class="track-record">' + (b.recommenderCount > 1 ? b.recommenderCount + ' trusted people' : b.recommenderNames.map(escapeHtml).join(', ')) + '</p></div>';
          out += '<span class="trend-score">' + b.score.toFixed(1) + '\u2605</span>';
          out += '</div>';
        });
        out += '</div>';
      }
      scored.forEach(({ e, record }) => {
        const stale = (Date.now() - e.ts) > ONE_YEAR_MS;
        out += '<div class="entry">';
        out += '<div class="entry-main">';
        out += '<p class="entry-title">' + escapeHtml(e.restaurant) + (e.ts > previousVisitTs ? ' <span class="new-badge">NEW</span>' : '') + (e.cost ? ' <span class="cost-tag">' + costLabel(e.cost) + '</span>' : '') + (e.friendId === me.friendId ? ' <button class="btn-text-link" data-edit-entry="' + e.id + '" style="background:none; border:none; font-size:12px; color:var(--brass-dim); text-decoration:underline; cursor:pointer; padding:0; margin-left:4px;">Edit</button> <button class="del-btn" data-delete-suggestion="' + e.id + '" title="Delete this entry" aria-label="Delete ' + escapeHtml(e.restaurant) + '">&times;</button>' : (isCurrentUserAdmin() ? ' <button class="btn-text-link" data-edit-entry="' + e.id + '" title="Edit as admin -- fix content, remove inappropriate material, add photos" style="background:none; border:none; font-size:12px; color:var(--rust); text-decoration:underline; cursor:pointer; padding:0; margin-left:4px;">Edit (admin)</button>' : '')) + '</p>';
        out += (function() {
          const trustInfo = e.friendId !== me.friendId ? myTrustInfo(e.friendId) : null;
          const trustLabel = trustInfo
            ? ' · ' + '\u2605'.repeat(trustInfo.weight) + '\u2606'.repeat(5 - trustInfo.weight) + (trustInfo.degree === 2 ? ' via ' + escapeHtml(trustInfo.via) : '')
            : '';
          const members = groupMembers(e).filter(m => m.id !== e.id && visibleFriendIds().has(m.friendId));
          const linkedBadge = members.length
            ? ' <span class="meta-badge" title="Also recommended by ' + members.map(m => escapeHtml(m.friendName)).join(', ') + '">+' + members.length + '</span>'
            : '';
          const outsideBadge = isOutsideExpertise(e)
            ? ' <span class="meta-badge meta-badge-warn" title="' + escapeHtml(e.friendName) + ' doesn\'t usually recommend ' + escapeHtml(e.cuisine || 'this cuisine') + '">off-cuisine</span>'
            : '';
          const staleBadge = stale
            ? ' <span class="meta-badge meta-badge-warn" title="Last confirmed over a year ago">stale</span>'
            : '';
          return '<p class="entry-meta">' + escapeHtml(e.cuisine || 'unspecified') + ' — ' + escapeHtml(e.friendName) + trustLabel + linkedBadge + outsideBadge + staleBadge + '</p>';
        })();
        if (e.note) out += '<p class="entry-note">' + escapeHtml(e.note) + '</p>';
        const pooledPhotos = pooledPhotosForRestaurant(e);
        if (pooledPhotos.length) {
          out += '<div class="entry-photos">';
          pooledPhotos.slice(0, 6).forEach((key, photoIdx) => {
            if (photoCache[key]) {
              out += '<img class="entry-photo-thumb" src="' + photoCache[key] + '" data-photo-key="' + key + '" data-entry-id="' + e.id + '" data-photo-index="' + photoIdx + '" alt="Photo of ' + escapeHtml(e.restaurant) + '">';
            } else {
              out += '<div class="entry-photo-loading"></div>';
              queuePhotoLoad(key);
            }
          });
          out += '</div>';
        }
        out += '</div>';
        out += '<div class="entry-side">';
        out += '<div class="rate-group"><span class="rate-label">Taste</span><div class="rate-dots">';
        for (let i = 1; i <= 5; i++) {
          out += '<button class="rate-star' + (e.ratingTaste >= i ? ' filled' : '') + '" data-rate-taste="' + e.id + '" data-val="' + i + '" aria-label="Rate ' + escapeHtml(e.restaurant) + ' taste ' + i + ' of 5 stars">' + (e.ratingTaste >= i ? '\u2605' : '\u2606') + '</button>';
        }
        out += '</div></div>';
        out += '<div class="rate-group"><span class="rate-label">Ambiance</span><div class="rate-dots">';
        for (let i = 1; i <= 5; i++) {
          out += '<button class="rate-star' + (e.ratingAmbiance >= i ? ' filled' : '') + '" data-rate-ambiance="' + e.id + '" data-val="' + i + '" aria-label="Rate ' + escapeHtml(e.restaurant) + ' ambiance ' + i + ' of 5 stars">' + (e.ratingAmbiance >= i ? '\u2605' : '\u2606') + '</button>';
        }
        out += '</div></div>';
        out += '<div class="rate-group"><span class="rate-label">Cost</span><div class="cost-btns">';
        for (let i = 1; i <= 4; i++) {
          out += '<button class="cost-btn' + (e.cost >= i ? ' filled' : '') + '" data-rate-cost="' + e.id + '" data-val="' + i + '" aria-label="Set ' + escapeHtml(e.restaurant) + ' cost level ' + i + ' of 4">' + '$'.repeat(i) + '</button>';
        }
        out += '</div></div>';
        out += '</div>';
        out += '</div>';
      });
    }
    out += '</div>';
  });

  if (!out) {
    return renderBoardControls(0, newSinceCount) + '<p class="empty">Nothing matches right now — try a different search or turn off "hide places I\'ve already added."</p>';
  }

  return renderBoardControls(totalVisible, newSinceCount) + out;
}

function titleCase(str) {
  return str.replace(/\b\w/g, c => c.toUpperCase());
}

// Matches an existing city by name AND state together, not name alone --
// two different real places can share a city name (Portland, OR vs
// Portland, ME being the classic example), so matching on name alone risks
// silently picking the wrong one and getting its coordinates, which would
// then feed wrong data into the nearby-major-city distance calculation.
function findExistingCity(cityName, stateName) {
  const typedCity = (cityName || '').trim().toLowerCase();
  const typedState = (stateName || '').trim().toLowerCase();
  if (!typedCity) return null;
  return state.cities.find(c => {
    if (c.name.toLowerCase() !== typedCity) return false;
    const cState = (c.state || '').trim().toLowerCase();
    // If either side hasn't specified a state, fall back to name-only
    // matching rather than force a mismatch -- this keeps older cities
    // saved before this feature existed working correctly.
    if (!typedState || !cState) return true;
    return cState === typedState;
  });
}

function updateSelectedCityIdFromForm() {
  const match = findExistingCity(formState.city, formState.state);
  selectedCityId = match ? match.id : null;
}

function buildCityDatalist() {
  const names = new Set();
  state.cities.forEach(c => names.add(c.name));
  Object.keys(US_CITY_COORDS).forEach(k => names.add(titleCase(k)));
  const options = Array.from(names).sort().map(n => '<option value="' + escapeHtml(n) + '"></option>').join('');
  return '<datalist id="city-suggestions">' + options + '</datalist>';
}

const US_STATE_ABBREVIATIONS = [
  "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA",
  "ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK",
  "OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY","DC"
];
function buildStateDatalist() {
  const names = new Set(US_STATE_ABBREVIATIONS);
  state.cities.forEach(c => { if (c.state) names.add(c.state); });
  const options = Array.from(names).sort().map(n => '<option value="' + escapeHtml(n) + '"></option>').join('');
  return '<datalist id="state-suggestions">' + options + '</datalist>';
}

function buildCuisineDatalist() {
  const names = new Set();
  MAJOR_CUISINES.forEach(c => names.add(c));
  state.suggestions.forEach(s => { if (s.cuisine) names.add(s.cuisine); });
  const options = Array.from(names).sort().map(n => '<option value="' + escapeHtml(n) + '"></option>').join('');
  return '<datalist id="cuisine-suggestions">' + options + '</datalist>';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

      try {
        const res = await fetch('/api/auth/request-link', {

    head.addEventListener('keydown', (evt) => {

  document.querySelectorAll('[data-rate-taste]').forEach(btn => {

  document.querySelectorAll('[data-rate-ambiance]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-rate-ambiance');
      const val = parseInt(btn.getAttribute('data-val'), 10);

      if (!s) return;
      s.ratingAmbiance = s.ratingAmbiance === val ? 0 : val;

      render();
    });
  });
  document.querySelectorAll('[data-rate-cost]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-rate-cost');
      const val = parseInt(btn.getAttribute('data-val'), 10);

      if (!s) return;
      s.cost = s.cost === val ? 0 : val;
      saveData();
      render();
    });
  });
}

function extractJsonArray(text) {
  const start = text.indexOf('[');
  if (start === -1) return text;
  let depth = 0, inString = false, escapeNext = false;
  for (let i = start; i < text.length; i++) {
    const ch = text[i];
    if (escapeNext) { escapeNext = false; continue; }
    if (ch === '\\') { escapeNext = true; continue; }
    if (ch === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (ch === '[') depth++;
    else if (ch === ']') {
      depth--;
      if (depth === 0) return text.slice(start, i + 1);
    }
  }
  return text.slice(start);
}

async function runRecommendation() {
  const queryEl = document.getElementById('rec-query');
  const query = queryEl.value.trim();
  if (!query) return;

  const isFollowUp = recConversation.length > 0;
  if (!isFollowUp) logEvent('rec_query_started', { isGroupMode: groupPickSelectedIds.size > 0 });
  recQuery = '';
  recLoading = true;
  recError = '';
  render();

  try {
    let userTurnContent;

    if (!isFollowUp) {
      const isGroupMode = groupPickSelectedIds.size > 0;
      let participantIds = null;
      if (isGroupMode) {
        participantIds = new Set(groupPickSelectedIds);
        participantIds.add(me.friendId);
        lastGroupModeParticipants = participantIds;
      } else {
        lastGroupModeParticipants = null;
      }

      const visibleIds = visibleFriendIds();
      const candidateFriendIds = isGroupMode ? new Set([...visibleIds, ...participantIds]) : visibleIds;
      let candidateSuggestions = state.suggestions.filter(s => candidateFriendIds.has(s.friendId) && s.restaurant);

      if (isGroupMode) {
        const seenGroups = new Set();
        candidateSuggestions = candidateSuggestions.filter(s => {
          const gid = groupIdFor(s);
          if (seenGroups.has(gid)) return false;
          seenGroups.add(gid);
          return true;
        });
      }

      // Reset the radius-match cache for this query, and build the shared
      // list of every distinct city name that actually has data (real
      // entries or seed picks) -- computed once and reused across all three
      // payload tiers below, rather than recomputed per entry.
      radiusMatchCache = {};
      const allCandidateCityNames = [
        ...new Set([
          ...state.cities.map(c => c.name),
          ...webSeedPicks.map(p => p.city)
        ])
      ];

      const friendPayload = candidateSuggestions
        .map(s => {
          const city = state.cities.find(c => c.id === s.cityId);
          const record = friendTrackRecord(s.friendId, s.cuisine);
          const suggester = state.friends.find(f => f.id === s.friendId);
          const expertise = (suggester && Array.isArray(suggester.cuisineExpertise) && suggester.cuisineExpertise.length)
            ? suggester.cuisineExpertise.join(', ')
            : 'not specified';
          const trustInfo = s.friendId === me.friendId ? { weight: 5, degree: 0, via: null } : myTrustInfo(s.friendId);
          const trustDescription = trustInfo.degree === 0
            ? '5/5 (this is you)'
            : trustInfo.degree === 2
              ? trustInfo.weight + '/5 (indirect — via ' + trustInfo.via + ', a mutual connection, not someone you rated directly)'
              : trustInfo.weight + '/5 (direct)';

          const cityName = city ? city.name : 'unknown';
          const nearbyCities = city ? citiesWithinRadius(cityName, city.state, allCandidateCityNames) : [];

          const item = {
            id: s.id,
            source: "friend",
            restaurant: s.restaurant,
            city: cityName,
            nearbyCities: nearbyCities,
            cuisine: s.cuisine || 'unspecified',
            cost: s.cost ? '$'.repeat(s.cost) : 'unknown',
            note: s.note || '',
            suggestedBy: s.friendName,
            ownTasteRating: s.ratingTaste > 0 ? (s.ratingTaste + '/5') : 'not yet rated',
            friendTrackRecordForThisCuisine: trackLabel(record),
            yourTrustInThisPerson: trustDescription,
            suggesterCuisineExpertise: expertise
          };

          if (isGroupMode) {
            const raters = groupMembers(s).filter(m => participantIds.has(m.friendId) && m.ratingTaste > 0);
            const raterNames = [...new Set(raters.map(m => m.friendName))];
            const avgRating = raters.length ? avg(raters.map(m => m.ratingTaste)) : null;
            item.groupCoverage = raterNames.length + ' of ' + participantIds.size + ' people going tonight have rated this (' + (raterNames.join(', ') || 'none yet') + ')';
            item.groupAverageRating = avgRating !== null ? roundHalf(avgRating) + '/5' : 'not yet rated by the group';
          }

          return item;
        });

      // Community tier: aggregated by actual restaurant identity, not shown
      // as individual entries from named strangers. The whole point is
      // collective signal, not one data point -- so this groups every
      // community member's entry for the same real-world restaurant
      // together, computes a genuine average rating and how many people
      // rated it, and combines their notes so the AI can write a real
      // summary rather than quoting one specific person. Sorted by rating
      // so the best community results genuinely come first, not randomly.
      const communitySuggestions = state.suggestions.filter(s => !candidateFriendIds.has(s.friendId) && s.restaurant);
      const communityGroups = {};
      communitySuggestions.forEach(s => {
        const gid = groupIdFor(s);
        if (!communityGroups[gid]) communityGroups[gid] = [];
        communityGroups[gid].push(s);
      });
      const communityPayload = Object.entries(communityGroups)
        .map(([gid, entries]) => {
          const first = entries[0];
          const city = state.cities.find(c => c.id === first.cityId);
          const rated = entries.filter(e => e.ratingTaste > 0);
          const avgRating = rated.length ? (rated.reduce((sum, e) => sum + e.ratingTaste, 0) / rated.length) : null;
          const notes = [...new Set(entries.map(e => e.note).filter(Boolean))].slice(0, 4);
          const cityName = city ? city.name : 'unknown';
          const nearbyCities = city ? citiesWithinRadius(cityName, city.state, allCandidateCityNames) : [];
          return {
            id: gid,
            source: "community consensus, not personally rated by you",
            restaurant: first.restaurant,
            city: cityName,
            nearbyCities: nearbyCities,
            cuisine: first.cuisine || 'unspecified',
            cost: first.cost ? '$'.repeat(first.cost) : 'unknown',
            communityRatingCount: entries.length,
            communityAverageRating: avgRating !== null ? avgRating.toFixed(1) + '/5' : 'not yet rated',
            notesFromMultiplePeople: notes.length ? notes : ['no written notes yet'],
            _avgForSorting: avgRating !== null ? avgRating : -1
          };
        })
        .sort((a, b) => b._avgForSorting - a._avgForSorting)
        .map(({ _avgForSorting, ...rest }) => rest);

      const webPayload = webSeedPicks.map(p => ({
        id: p.id,
        source: "web reviews, not a friend",
        restaurant: p.restaurant,
        city: p.city,
        nearbyCities: citiesWithinRadius(p.city, null, allCandidateCityNames),
        cuisine: p.cuisine || 'unspecified',
        cost: p.cost ? '$'.repeat(p.cost) : 'unknown',
        note: p.note
      }));

      const personalPayload = friendPayload.concat(communityPayload);

      if (!webPayload.length && !personalPayload.length) {
        recResults = [];
        recLoading = false;
        render();
        return;
      }

      // Split into two content blocks rather than one combined string.
      // webPayload is identical for every user and barely ever changes
      // (only when seed data is imported), so it's marked as a cache
      // breakpoint -- Anthropic charges close to full price the first time
      // any user's request creates this cache entry, then a small fraction
      // of that on every subsequent request from anyone, for up to 5
      // minutes of inactivity (refreshed on each hit). Given this block is
      // typically the majority of the tokens in a request, this is the
      // actual cost saving, not just a token gesture. personalPayload
      // varies per person and per request, so it's sent uncached, right
      // after the cached block.
      userTurnContent = [
        {
          type: "text",
          text: "Baseline/reference restaurant options, shared across all requests:\n" + JSON.stringify(webPayload),
          cache_control: { type: "ephemeral", ttl: "1h" }
        },
        {
          type: "text",
          text: (isGroupMode ? "This is a GROUP request for " + participantIds.size + " people going out together tonight. " : "") + "Request: " + query + "\n\nAdditional options from this person's circle and the wider community (combine these with the baseline options above as one full list to choose from):\n" + JSON.stringify(personalPayload)
        }
      ];
    } else {
      userTurnContent = "Refinement of the previous request — apply this as an adjustment to what you already suggested, still choosing only from the same 'Available options' list given earlier, unless nothing there fits, in which case say so: " + query;
    }

    recConversation.push({ role: "user", content: userTurnContent });

    let response;
    let lastFetchError = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        response = await fetch("/api/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: recConversation
          })
        });
        if (response.ok) { lastFetchError = null; break; }
        let apiErrorMsg = 'HTTP ' + response.status;
        let isRateLimit = false;
        let resetsAt = null;
        try {
          const errBody = await response.json();
          const bodyText = JSON.stringify(errBody);
          if (bodyText.includes('exceeded_limit') || bodyText.includes('rate_limit')) {
            isRateLimit = true;
            const match = bodyText.match(/"resetsAt"\s*:\s*"?(\d+)"?/);
            if (match) resetsAt = parseInt(match[1], 10);
          }
          if (errBody && errBody.error && errBody.error.message) apiErrorMsg = errBody.error.message;
        } catch (e) { /* body wasn't JSON, keep the status-based message */ }
        lastFetchError = new Error(apiErrorMsg);
        lastFetchError.isRateLimit = isRateLimit;
        lastFetchError.resetsAt = resetsAt;
        if (isRateLimit) break; // retrying immediately can't fix a usage limit — don't waste attempts
      } catch (e) {
        lastFetchError = e;
      }
      if (attempt < 2) await new Promise(r => setTimeout(r, 500));
    }
    if (lastFetchError) throw lastFetchError;

    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('No response text');

    recConversation.push({ role: "assistant", content: textBlock.text });

    const parsed = textBlock.text
      .split('\n')
      .map(line => line.trim())
      .filter(line => line.length > 0 && line.includes('|'))
      .map(line => {
        const pipeIdx = line.indexOf('|');
        return { id: line.slice(0, pipeIdx).trim(), reason: line.slice(pipeIdx + 1).trim() };
      })
      .filter(p => p.id.length > 0);

    recResults = parsed
      .map(p => {
        // Community picks are now sent to the AI keyed by group ID (which
        // may be a canonicalId shared by several people's entries, or a
        // single entry's own id if nobody else has logged the same place)
        // rather than one specific suggestion's id -- so this has to
        // resolve the id back to every entry in that group for the average
        // rating and count to display correctly, not just find one row.
        const communityMatches = state.suggestions.filter(s => !visibleFriendIds().has(s.friendId) && s.restaurant && groupIdFor(s) === p.id);
        if (communityMatches.length) {
          const rated = communityMatches.filter(e => e.ratingTaste > 0);
          const avgRating = rated.length ? (rated.reduce((sum, e) => sum + e.ratingTaste, 0) / rated.length) : null;
          return {
            source: 'community',
            communityGroup: communityMatches,
            communityAvgRating: avgRating,
            communityRaterCount: communityMatches.length,
            reason: p.reason
          };
        }
        const friendMatch = state.suggestions.find(s => s.id === p.id);
        if (friendMatch) {
          const isInOwnCircle = visibleFriendIds().has(friendMatch.friendId);
          if (isInOwnCircle) return { source: 'friend', suggestion: friendMatch, reason: p.reason };
        }
        const webMatch = webSeedPicks.find(w => w.id === p.id);
        if (webMatch) return { source: 'web', webPick: webMatch, reason: p.reason };
        return null;
      })
      .filter(Boolean);

    // Guaranteed tier ordering, enforced here rather than only asked of the
    // AI -- the prompt already instructs friend picks first, but that's a
    // request the model can occasionally get wrong (exactly what happened
    // here: a web match outranked a genuine friend recommendation). Sorting
    // explicitly by source tier after parsing makes "friends always come
    // first" a hard guarantee instead of a hope, while preserving the AI's
    // own relative ranking within each tier (a stable sort keeps items with
    // the same tier in the order the AI returned them).
    const TIER_ORDER = { friend: 0, community: 1, web: 2 };
    recResults = recResults
      .map((r, idx) => ({ r, idx }))
      .sort((a, b) => (TIER_ORDER[a.r.source] - TIER_ORDER[b.r.source]) || (a.idx - b.idx))
      .map(x => x.r);

    recResultsShownCount = Math.min(5, recResults.length);
    logEvent('rec_query_completed', { resultCount: recResults.length, wasFollowUp: isFollowUp });
  } catch (e) {
    console.error('recommendation failed', e);
    logEvent('error', { message: 'recommendation failed: ' + (e && e.message ? e.message : String(e)), isRateLimit: !!(e && e.isRateLimit) });
    if (e && e.isRateLimit) {
      if (e.resetsAt) {
        const minutesLeft = Math.max(1, Math.round((e.resetsAt - Date.now()) / 60000));
        const timeDesc = minutesLeft >= 60 ? Math.round(minutesLeft / 60) + ' hour' + (Math.round(minutesLeft / 60) === 1 ? '' : 's') : minutesLeft + ' minute' + (minutesLeft === 1 ? '' : 's');
        recError = "You've hit your personal Claude usage limit for now — this is tied to your own account, not the app. Should reset in about " + timeDesc + '.';
      } else {
        recError = "You've hit your personal Claude usage limit for now — this is tied to your own account, not the app. Try again later once it resets.";
      }
    } else {
      recError = "Couldn't get suggestions after a few tries — give it a moment and try again.";
    }
    if (recConversation.length && recConversation[recConversation.length - 1].role === 'user') recConversation.pop();
  }

  recLoading = false;
  render();
}

function resetRecommendation() {
  recQuery = '';
  recResults = null;
  recResultsShownCount = 5;
  recError = '';
  recConversation = [];
  lastGroupModeParticipants = null;
  render();
}

let isSubmittingSuggestion = false;

async function submitSuggestionInner() {
  if (isSubmittingSuggestion) return;
  isSubmittingSuggestion = true;
  const submitBtn = document.getElementById('f-submit');
  if (submitBtn) submitBtn.disabled = true;

  const msg = document.getElementById('f-msg');

  const cityInputEl = document.getElementById('f-city');
  const stateInputEl = document.getElementById('f-state');
  const cityName = (cityInputEl ? cityInputEl.value : formState.city || '').trim();
  const stateName = (stateInputEl ? stateInputEl.value : formState.state || '').trim();
  if (!cityName) { msg.textContent = 'Enter a city.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }
  if (!stateName) { msg.textContent = 'Enter a state (or country if outside the US) — this keeps cities with the same name in different places from getting mixed up.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }

  if (cityName !== cityConfirmBypassFor) {
    const similarCity = findSimilarCity(cityName);
    if (similarCity) {
      pendingCityConfirm = { typedName: cityName, suggestedName: similarCity };
      isSubmittingSuggestion = false;
      if (submitBtn) submitBtn.disabled = false;
      render();
      return;
    }
  }
  cityConfirmBypassFor = null;

  let cityId;
  const existingCity = findExistingCity(cityName, stateName);
  if (existingCity) {
    cityId = existingCity.id;
    if (!existingCity.state) existingCity.state = stateName;
  } else {
    cityId = uid();
    const known = lookupCoords(cityName, stateName);
    state.cities.push({ id: cityId, name: cityName, state: stateName, lat: known ? known[0] : null, lon: known ? known[1] : null });
  }

  // Read from formState rather than re-querying the DOM by element ID — these
  // are already kept in sync by each field's own input/change handler, and
  // this avoids ever breaking again if a field's element ID changes (this is
  // exactly what happened when cuisine became a dropdown: this code still
  // looked for the old id="f-cuisine" input, which no longer existed).
  const restaurant = (formState.restaurant || '').trim();
  const cuisine = (formState.cuisine || '').trim();
  const note = (formState.note || '').trim();

  if (!restaurant) { msg.textContent = 'Enter a restaurant name.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }

  if (formState.taste === 0) { msg.textContent = 'Give it a taste rating — that\'s what tells friends this is worth trying.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }

  const context = { cityId, restaurant, cuisine, note };
  const match = findSimilarEntry(me.friendId, restaurant);

  if (match && !match.exact) {
    // Fuzzy (not exact) match on your own entries — needs a real decision, shown
    // as in-app UI rather than a native confirm(), which appears to be silently
    // blocked inside this artifact's sandbox.
    pendingMergeConfirm = { type: 'own', matchEntry: match.entry, context };
    isSubmittingSuggestion = false;
    if (submitBtn) submitBtn.disabled = false;
    render();
    return;
  }

  const existingEntry = (match && match.exact) ? match.entry : null;
  await proceedAfterOwnMergeDecision(existingEntry, context);
}

function startEditingEntry(entryId) {

async function submitEntryEdit() {
  if (isSubmittingSuggestion) return;
  isSubmittingSuggestion = true;
  const submitBtn = document.getElementById('f-submit');
  if (submitBtn) submitBtn.disabled = true;
  const msg = document.getElementById('f-msg');

  try {
    const entry = state.suggestions.find(s => s.id === editingEntryId && (s.friendId === me.friendId || isCurrentUserAdmin()));
    if (!entry) { if (msg) msg.textContent = 'This entry no longer exists.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }

    const restaurant = (formState.restaurant || '').trim();
    const cityName = (formState.city || '').trim();
    const stateName = (formState.state || '').trim();
    if (!restaurant) { if (msg) msg.textContent = 'Enter a restaurant name.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }
    if (!cityName) { if (msg) msg.textContent = 'Enter a city.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }
    if (!stateName) { if (msg) msg.textContent = 'Enter a state (or country if outside the US) — this keeps cities with the same name in different places from getting mixed up.'; isSubmittingSuggestion = false; if (submitBtn) submitBtn.disabled = false; return; }

    let cityId = entry.cityId;
    const existingCity = findExistingCity(cityName, stateName);
    if (existingCity) {
      cityId = existingCity.id;
      if (!existingCity.state) existingCity.state = stateName;
    } else {
      cityId = uid();
      const known = lookupCoords(cityName, stateName);
      state.cities.push({ id: cityId, name: cityName, state: stateName, lat: known ? known[0] : null, lon: known ? known[1] : null });
    }

    // Upload any newly added photos, then combine with the existing photos
    // that weren't explicitly removed -- this genuinely adds to what's
    // already there rather than wholesale replacing every photo just
    // because one new one was added.
    const newlyUploadedKeys = [];
    for (let i = 0; i < formState.photos.length; i++) {
      try {
        const res = await fetch('/api/photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataUrl: formState.photos[i] }),
        });
        if (res.ok) {
          const { key } = await res.json();
          newlyUploadedKeys.push(key);
        }
      } catch (e) {
        console.error('photo save failed', e);
      }
    }

    const originalKeys = entry.photoKeys || [];
    const removedKeys = originalKeys.filter(k => !editKeptPhotoKeys.includes(k));
    const finalPhotoKeys = editKeptPhotoKeys.concat(newlyUploadedKeys);

    removedKeys.forEach(key => {
      fetch('/api/photos/' + key, { method: 'DELETE' }).catch(() => {});
    });

    entry.restaurant = restaurant;
    entry.cityId = cityId;
    entry.cuisine = (formState.cuisine || '').trim();
    entry.note = (formState.note || '').trim();
    entry.ratingTaste = formState.taste;
    entry.ratingAmbiance = formState.ambiance;
    entry.cost = formState.cost;
    entry.photoKeys = finalPhotoKeys;

    selectedCityId = cityId;
    confirmationMsg = 'Saved your changes to "' + restaurant + '".';
    isDuplicateEntryMsg = false;
    await saveData();
    logEvent('entry_edited', {});

    editingEntryId = null;
    editKeptPhotoKeys = [];
    isSubmittingSuggestion = false;
    formState = { city: (state.cities.find(c => c.id === cityId) || {}).name || '', state: (state.cities.find(c => c.id === cityId) || {}).state || '', restaurant: '', cuisine: '', note: '', taste: 0, ambiance: 0, cost: 0, photos: [] };
    cuisineOtherMode = false;
    render();

    const boardEl = document.querySelector('[data-city-id="' + cityId + '"]');
    if (boardEl) boardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => { confirmationMsg = ''; render(); }, 4000);
  } catch (e) {
    console.error('submitEntryEdit failed unexpectedly', e);
    logEvent('error', { message: 'submitEntryEdit crashed: ' + (e && e.message ? e.message : String(e)) });
    isSubmittingSuggestion = false;
    if (submitBtn) submitBtn.disabled = false;
    if (msg) msg.textContent = 'Something went wrong saving that — please try again.';
  }
}

async function submitSuggestion() {
  try {
    await submitSuggestionInner();
  } catch (e) {
    // A genuinely unexpected failure anywhere in the submission chain used to
    // leave the button permanently disabled and every future click as a
    // silent no-op, with no visible error at all — this guarantees recovery
    // and a real message no matter what actually broke.
    console.error('submitSuggestion failed unexpectedly', e);
    logEvent('error', { message: 'submitSuggestion crashed: ' + (e && e.message ? e.message : String(e)) });
    isSubmittingSuggestion = false;
    const submitBtn = document.getElementById('f-submit');
    if (submitBtn) submitBtn.disabled = false;
    const msg = document.getElementById('f-msg');
    if (msg) { msg.textContent = 'Something went wrong submitting that — please try again.'; }
  }
}

async function proceedAfterOwnMergeDecision(existingEntry, context) {
  if (!existingEntry) {
    const crossMatch = findCrossFriendMatch(context.cityId, context.restaurant, me.friendId);
    if (crossMatch) {
      pendingMergeConfirm = { type: 'cross', crossMatch, context };
      isSubmittingSuggestion = false;
      const submitBtn = document.getElementById('f-submit');
      if (submitBtn) submitBtn.disabled = false;
      render();
      return;
    }
  }
  await finishSubmission(existingEntry, null, context);
}

function confirmCityYes() {
  if (!pendingCityConfirm) return;
  const { suggestedName } = pendingCityConfirm;
  const cityInput = document.getElementById('f-city');
  if (cityInput) cityInput.value = suggestedName;
  formState.city = suggestedName;
  pendingCityConfirm = null;
  submitSuggestion();
}

function confirmCityNo() {
  if (!pendingCityConfirm) return;
  cityConfirmBypassFor = pendingCityConfirm.typedName;
  pendingCityConfirm = null;
  submitSuggestion();
}

function confirmOwnMergeYes() {
  if (!pendingMergeConfirm) return;
  const { matchEntry, context } = pendingMergeConfirm;
  pendingMergeConfirm = null;
  proceedAfterOwnMergeDecision(matchEntry, context);
}

function confirmOwnMergeNo() {
  if (!pendingMergeConfirm) return;
  const { context } = pendingMergeConfirm;
  pendingMergeConfirm = null;
  proceedAfterOwnMergeDecision(null, context);
}

function confirmCrossMergeYes() {
  if (!pendingMergeConfirm) return;
  const { crossMatch, context } = pendingMergeConfirm;
  pendingMergeConfirm = null;
  const crossFriendCanonicalId = crossMatch.canonicalId || crossMatch.id;
  if (!crossMatch.canonicalId) crossMatch.canonicalId = crossFriendCanonicalId;
  finishSubmission(null, crossFriendCanonicalId, context);
}

function confirmCrossMergeNo() {
  if (!pendingMergeConfirm) return;
  const { context } = pendingMergeConfirm;
  pendingMergeConfirm = null;
  finishSubmission(null, null, context);
}

async function finishSubmission(existingEntry, crossFriendCanonicalId, context) {
  const { cityId, restaurant, cuisine, note } = context;

  const entryId = existingEntry ? existingEntry.id : uid();
  let photoKeys = existingEntry ? (existingEntry.photoKeys || []) : [];
  if (formState.photos.length > 0) {
    const oldKeysToDelete = photoKeys.slice();
    const newKeys = [];
    for (let i = 0; i < formState.photos.length; i++) {
      try {
        const res = await fetch('/api/photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataUrl: formState.photos[i] }),
        });
        if (res.ok) {
          const { key } = await res.json();
          newKeys.push(key);
        }
      } catch (e) {
        console.error('photo save failed', e);
      }
    }
    photoKeys = newKeys;
    oldKeysToDelete.forEach(key => {
      fetch('/api/photos/' + key, { method: 'DELETE' }).catch(() => {});
    });
  }

  let duplicateUpdated = false;
  if (existingEntry) {
    existingEntry.restaurant = restaurant;
    existingEntry.cityId = cityId;
    existingEntry.cuisine = cuisine;
    existingEntry.note = note;
    existingEntry.ratingTaste = formState.taste;
    existingEntry.ratingAmbiance = formState.ambiance;
    existingEntry.cost = formState.cost;
    existingEntry.photoKeys = photoKeys;
    existingEntry.ts = Date.now();
    duplicateUpdated = true;
  } else {
    state.suggestions.push({
      id: entryId, cityId, friendId: me.friendId, friendName: me.name,
      restaurant, cuisine, note, ts: Date.now(),
      ratingTaste: formState.taste, ratingAmbiance: formState.ambiance, cost: formState.cost,
      photoKeys: photoKeys,
      canonicalId: crossFriendCanonicalId
    });
  }

  selectedCityId = cityId;
  confirmationMsg = duplicateUpdated
    ? 'An entry for "' + restaurant + '" already exists under your name — it was updated with your new ratings and note instead of creating a duplicate.'
    : 'Shared — see it in the board below.';
  await saveData();
  logEvent('entry_form_submitted', { wasDuplicateUpdate: duplicateUpdated });
  entryFormStartedLogged = false;
  isSubmittingSuggestion = false;
  isDuplicateEntryMsg = duplicateUpdated;
  formState = { city: (state.cities.find(c => c.id === cityId) || {}).name || '', state: (state.cities.find(c => c.id === cityId) || {}).state || '', restaurant: '', cuisine: '', note: '', taste: 0, ambiance: 0, cost: 0, photos: [] };
  cuisineOtherMode = false;
  render();

  const boardEl = document.querySelector('[data-city-id="' + cityId + '"]');
  if (boardEl) boardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  setTimeout(() => {
    confirmationMsg = '';
    isDuplicateEntryMsg = false;
    const el = document.getElementById('f-msg');
    if (el) { el.textContent = ''; el.classList.remove('msg-success', 'msg-duplicate'); }
  }, 4000);
}

(async function init() {
  window.addEventListener('error', (e) => {
    // "Script error." with no filename/line is the standard browser signature for
    // an error from a cross-origin script we don't control — no diagnostic value,
    // and logging it repeatedly is exactly the kind of noise that floods storage.
    if ((e.message === 'Script error.' || !e.message) && !e.filename) return;
    logEvent('error', { message: (e.message || 'unknown error').slice(0, 300), source: (e.filename || '').split('/').pop(), line: e.lineno || 0 });
  });
  window.addEventListener('unhandledrejection', (e) => {
    const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason || 'unknown rejection');
    logEvent('error', { message: msg.slice(0, 300), context: 'unhandledrejection' });
  });
  try {
    const meRes = await fetch('/api/auth/me');
    if (meRes.ok) {
      const meData = await meRes.json();
      sessionEmail = meData.email;
    } else {
      sessionEmail = null;
    }
  } catch (e) { sessionEmail = null; }
  authChecked = true;

  if (!sessionEmail) { render(); return; }

  try {
    const params = new URLSearchParams(window.location.search);
    inviterFriendId = params.get('ref') || null;
    adminBootstrapRequested = params.get('admin') === 'setup';
  } catch (e) { inviterFriendId = null; }
  await loadData();
  await loadIdentity();

  await applyAdminBootstrapIfRequested();

  render();
  if (me) tryGeolocate();
  maybeAutoSnapshot();
})();
</script>
