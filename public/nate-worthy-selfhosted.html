<style>
  :root {
    --ink: #1B3A4B;
    --ink-2: #24495D;
    --paper: #FAF7F2;
    --brass: #2E8B8B;
    --brass-dim: #206666;
    --rust: #E07856;
    --text-on-ink: #F5F0E6;
    --text-on-ink-dim: #B7C7CE;
    --text-on-paper: #22333F;
    --text-on-paper-dim: #8A9599;
  }
  * { box-sizing: border-box; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible, a:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text-on-paper);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 110px; }
  .masthead {
    border-bottom: 1px solid rgba(241,236,221,0.15);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .seal {
    flex-shrink: 0;
    transform: rotate(-4deg);
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .wordmark-dash {
    color: var(--brass);
    font-weight: 400;
  }
  .masthead p {
    margin: 0;
    color: var(--text-on-paper-dim);
    font-size: 14px;
    max-width: 46ch;
    line-height: 1.5;
  }
  .card {
    background: #fff;
    color: var(--text-on-paper);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    box-shadow: 0 1px 3px rgba(27,58,75,0.02), 0 8px 20px rgba(27,58,75,0.05);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover {
    box-shadow: 0 2px 6px rgba(27,58,75,0.04), 0 12px 28px rgba(27,58,75,0.08);
    transform: translateY(-1px);
  }
  .rec-card { background: transparent; border: none; }
  .rec-card::before { display: none; }
  .rec-card h2 { color: var(--text-on-paper); font-size: 28px; }
  .rec-card .hint { color: var(--text-on-paper-dim); }
  .rec-card textarea {
    background: #fff;
    border: none;
    color: var(--text-on-paper);
    min-height: 70px;
    box-shadow: 0 2px 5px rgba(27,58,75,0.03), 0 10px 26px rgba(27,58,75,0.06);
  }
  .rec-card textarea::placeholder { color: var(--text-on-paper-dim); }
  .rec-card textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--brass), 0 10px 26px rgba(27,58,75,0.06); }
  .rec-status { font-size: 13px; color: var(--text-on-paper-dim); margin-top: 12px; }
  .rec-results { margin-top: 20px; }
  .rec-pick {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 4px;
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .rec-pick:last-child { margin-bottom: 0; }
  .rec-pick-title { font-weight: 600; font-size: 15px; margin: 0 0 2px; }
  .rec-pick-meta { font-size: 12px; color: var(--text-on-paper-dim); margin: 0 0 6px; }
  .rec-pick-reason {
    font-family: var(--font-voice, inherit);
    font-style: italic;
    font-size: 13px;
    color: var(--brass-dim);
    margin: 0;
    line-height: 1.5;
  }
  .card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card .hint {
    color: var(--text-on-paper-dim);
    font-size: 13px;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-on-paper-dim);
    margin: 16px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"], select, textarea {
    width: 100%;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-on-paper);
    box-shadow: 0 1px 2px rgba(27,58,75,0.03), 0 4px 12px rgba(27,58,75,0.04);
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--brass);
  }
  textarea { resize: vertical; min-height: 56px; font-family: inherit; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 100px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--ink-2); }
  .btn-ghost {
    background: transparent;
    border: 1px solid rgba(34,51,63,0.25);
    color: var(--text-on-paper);
  }
  .btn-ghost:hover { border-color: var(--brass-dim); color: var(--brass-dim); }
  .btn-small { padding: 6px 12px; font-size: 10px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
  .msg { font-size: 13px; color: var(--brass-dim); margin-left: 4px; }
  .msg-success { color: #2E6B3E; font-weight: 500; }
  .msg-duplicate { color: var(--rust); font-weight: 500; }
  .inline-add { display: flex; gap: 8px; margin-top: 8px; }
  .inline-add input { flex: 1; }
  .signed-in {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(46,139,139,0.12);
    border: 1px solid rgba(46,139,139,0.35);
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .signed-in a { color: var(--brass-dim); text-decoration: underline; cursor: pointer; font-size: 12px; }
  .status-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 8px;
  }
  .status-strip .who { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--text-on-paper); }
  .status-strip .stats { display: flex; gap: 14px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-on-paper-dim); }
  .status-strip .stats b { color: var(--text-on-paper); font-weight: 600; }
  .switch-link { font-size: 12px; color: var(--text-on-paper-dim); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-family: 'Inter', sans-serif; padding: 0; }

  .tab-bar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 4px; background: #fff; border-radius: 100px; padding: 6px;
    box-shadow: 0 4px 12px rgba(27,58,75,0.06), 0 16px 40px rgba(27,58,75,0.10);
    max-width: calc(480px - 48px); width: calc(100% - 48px);
  }
  .tab-btn {
    flex: 1; background: none; border: none; padding: 11px 4px; border-radius: 100px; font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.04em; color: var(--text-on-paper-dim);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab-btn.active { background: var(--ink); color: #fff; font-weight: 600; }
  .tab-icon { font-size: 16px; line-height: 1; }

  .hero-panel {
    background: transparent; border-radius: 14px; padding: 26px 4px; color: var(--text-on-paper);
    position: relative; overflow: hidden; margin-bottom: 16px;
  }
  .hero-panel h2 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 6px;
    letter-spacing: -0.01em; position: relative; color: var(--text-on-paper);
  }
  .hero-panel .hint { color: var(--text-on-paper-dim); position: relative; margin: 0 0 18px; }
  .hero-panel label { color: var(--text-on-paper-dim); position: relative; }
  .hero-panel textarea, .hero-panel input[type="text"] {
    position: relative; background: #fff; color: var(--text-on-paper);
    border: none; border-radius: 14px;
    box-shadow: 0 2px 5px rgba(27,58,75,0.03), 0 10px 26px rgba(27,58,75,0.06);
  }
  .hero-panel textarea:focus, .hero-panel input[type="text"]:focus {
    outline: none; box-shadow: 0 0 0 2px var(--brass), 0 10px 26px rgba(27,58,75,0.06);
  }
  .hero-panel textarea::placeholder, .hero-panel input::placeholder { color: var(--text-on-paper-dim); }
  .hero-panel .btn-primary { position: relative; background: var(--brass); color: #fff; border-radius: 100px; }
  .hero-panel .btn-primary:hover { background: var(--brass-dim); }
  .hero-panel .btn-ghost {
    position: relative; background: rgba(46,139,139,0.08); color: var(--brass-dim);
    border: none; border-radius: 100px;
  }
  .hero-panel .group-pick-list { position: relative; background: #fff; border-radius: 14px; box-shadow: 0 2px 5px rgba(27,58,75,0.03), 0 10px 26px rgba(27,58,75,0.06); }
  .hero-panel .rec-results { position: relative; }
  .hero-panel .rec-pick { background: #fff; color: var(--text-on-paper); border-radius: 14px; box-shadow: 0 2px 5px rgba(27,58,75,0.03), 0 10px 26px rgba(27,58,75,0.06); }

  .quiet-zone { margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid rgba(245,240,230,0.15); }
  .quiet-zone .card {
    background: var(--paper); color: var(--text-on-paper); border: none; box-shadow: none;
    border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;
  }
  .quiet-zone .card h2 { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-on-paper-dim); }
  .quiet-zone .card .section-label { color: var(--text-on-paper-dim); }
  .cuisine-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 14px; }
  .cuisine-chips .chip {
    font-size: 12px; padding: 6px 13px; border-radius: 20px; border: 1px solid rgba(34,51,63,0.15);
    color: var(--text-on-paper-dim); background: #fff; white-space: nowrap; cursor: pointer;
  }
  .cuisine-chips .chip.selected { background: var(--brass); border-color: var(--brass); color: #fff; font-weight: 600; }
  .cuisine-chips .chip.more { border-style: dashed; }
  .cuisine-chips .chip.hidden-cuisine-chip { display: none; }

  #section-board, #section-recommend, #section-circle, #section-share-favorite, #section-admin { scroll-margin-top: 52px; }
  .share-card { padding: 20px 24px; }
  .share-tabs { display: flex; gap: 6px; margin: 10px 0 14px; }
  .share-tab {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    background: transparent; border: 1px solid rgba(34,51,63,0.18); color: var(--text-on-paper-dim);
    border-radius: 16px; padding: 7px 14px; cursor: pointer;
  }
  .share-tab.active { background: var(--brass); border-color: var(--brass); color: #fff; }
  .share-row { display: flex; gap: 8px; }
  .share-row input { flex: 1; font-size: 13px; color: var(--text-on-paper-dim); background: rgba(34,51,63,0.04); }
  #share-msg { display: inline-block; margin-top: 8px; }
  .geo-note {
    font-size: 12px;
    color: var(--text-on-paper-dim);
    margin: 4px 0 16px;
    font-style: italic;
  }
  .combobox-wrap { position: relative; }
  .combobox-input { padding-right: 30px !important; }
  .combobox-chevron {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-on-paper-dim); font-size: 12px; pointer-events: none;
  }
  .show-more-wrap { text-align: center; margin-top: 14px; }
  .show-more-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    background: rgba(27,58,75,0.05); border: none; color: var(--ink); border-radius: 100px; padding: 11px 22px; cursor: pointer;
  }
  .show-more-btn:hover { background: rgba(27,58,75,0.09); }
  .show-more-hint { font-size: 11px; color: var(--text-on-paper-dim); margin: 8px 0 0; }
  .postcard {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .postcard-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dashed rgba(34,51,63,0.2);
  }
  .postmark {
    width: 46px; height: 46px;
    border: 1.5px solid var(--rust);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--rust);
    flex-shrink: 0;
    transform: rotate(-6deg);
  }
  .postcard-head h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0;
  }
  .postcard-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-on-paper-dim);
  }
  .head-left { display: flex; align-items: center; gap: 12px; }
  .web-source-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--brass-dim);
    border: 1px solid rgba(46,139,139,0.4);
    border-radius: 2px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .friend-source-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 700;
    color: #fff;
    background: var(--brass);
    border-radius: 2px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .rec-pick-friend {
    border-left: 4px solid var(--brass);
    padding-left: 16px;
    background: rgba(46,139,139,0.07);
  }
  .hero-panel .rec-pick.rec-pick-friend {
    background: rgba(46,139,139,0.08);
  }
  .rec-pick-friend .rec-pick-meta .friend-name {
    color: var(--brass-dim);
    font-weight: 700;
  }
  .community-source-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--rust);
    border: 1px solid rgba(224,120,86,0.4);
    border-radius: 2px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  @keyframes highlightPulse {
    0% { background: rgba(224,120,86,0.18); }
    100% { background: transparent; }
  }
  .highlight-pulse {
    animation: highlightPulse 2s ease-out;
    border-radius: 6px;
  }
  .group-pick-list {
    margin-top: 10px; padding: 12px 14px; background: rgba(46,139,139,0.06);
    border-radius: 4px; display: flex; flex-direction: column; gap: 8px;
  }
  .group-pick-row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .group-pick-suggestions { margin-bottom: 8px; }
  .group-pick-suggestion-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 6px; font-size: 13.5px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .group-pick-suggestion-row:last-child { border-bottom: none; }
  .group-pick-suggestion-row .avatar-sm {
    width: 26px; height: 26px; border-radius: 50%; background: var(--brass); color: #fff;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .group-pick-suggestion-row .add-hint { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--brass-dim); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .chip {
    display: flex; align-items: center; gap: 6px; background: rgba(46,139,139,0.1); color: var(--brass-dim);
    border-radius: 100px; padding: 6px 6px 6px 12px; font-size: 12.5px; font-weight: 600;
  }
  .chip button { background: none; border: none; color: var(--brass-dim); font-size: 14px; cursor: pointer; padding: 0 4px; }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(34,51,63,0.08);
  }
  .entry:last-child { border-bottom: none; }
  .entry-main { flex: 1; min-width: 0; }
  .entry-title { font-weight: 600; font-size: 15px; margin: 0 0 2px; }
  .entry-meta { font-size: 12px; color: var(--text-on-paper-dim); margin: 0 0 4px; }
  .entry-note { font-size: 13px; color: var(--text-on-paper); line-height: 1.4; margin: 0 0 4px; }
  .track-record { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--brass-dim); }
  .cost-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--brass-dim); font-weight: 500; }
  .entry-side { flex-shrink: 0; text-align: right; }
  .rate-group { margin-bottom: 8px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .rate-group:last-child { margin-bottom: 0; }
  .rate-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-on-paper-dim);
    width: 58px;
    text-align: right;
  }
  .cost-btns { display: flex; gap: 3px; }
  .cost-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    border: 1px solid rgba(34,51,63,0.25);
    background: transparent;
    color: var(--text-on-paper-dim);
    border-radius: 3px;
    padding: 3px 6px;
    cursor: pointer;
  }
  .cost-btn.filled { background: var(--brass); border-color: var(--brass); color: #FFFFFF; }
  .rate-dots { display: flex; gap: 2px; justify-content: flex-end; margin-bottom: 4px; }
  .rate-star {
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    font-size: 18px;
    line-height: 22px;
    color: rgba(34,51,63,0.22);
    transition: color 0.12s ease, transform 0.12s ease;
  }
  .rate-star:hover { color: var(--rust); transform: scale(1.15); }
  .rate-star.filled { color: var(--rust); }
  .rate-star-trust:hover { color: var(--brass); }
  .rate-star-trust.filled { color: var(--brass); }
  .empty { color: var(--text-on-paper-dim); font-size: 13px; font-style: italic; padding: 8px 0; }
  .friend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(34,51,63,0.08);
  }
  .friend-row:last-child { border-bottom: none; }
  .friend-name { font-weight: 600; font-size: 14px; }
  .friend-stat { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-on-paper-dim); }
  .scale-legend { padding: 16px 24px; margin-bottom: 16px; }
  .legend-row { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; }
  .legend-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--brass-dim);
    width: 70px;
    flex-shrink: 0;
  }
  .legend-desc { font-size: 12px; color: var(--text-on-paper-dim); line-height: 1.4; }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px 60px; }
    .masthead h1 { font-size: 26px; }
    .seal { width: 40px; height: 40px; }

let showQuickConnect = false;

function normalizeName(str) {
  return (str || '')
    .toLowerCase()
    .replace(/['’.,\-&]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

function findSimilarCity(typedName) {
  const normalized = normalizeName(typedName);
  if (!normalized) return null;

  const allKnownNames = new Set();
  state.cities.forEach(c => allKnownNames.add(c.name));
  Object.keys(US_CITY_COORDS).forEach(k => allKnownNames.add(titleCase(k)));

  for (const name of allKnownNames) {
    if (normalizeName(name) === normalized) return null; // exact match, nothing to confirm
  }

  let best = null, bestDist = Infinity;
  allKnownNames.forEach(name => {
    const candidateNorm = normalizeName(name);
    const dist = levenshtein(normalized, candidateNorm);
    const maxLen = Math.max(normalized.length, candidateNorm.length);
    const similarity = maxLen > 0 ? 1 - (dist / maxLen) : 0;
    if (similarity >= 0.75 && dist < bestDist && dist > 0) {
      best = name;
      bestDist = dist;
    }
  });
  return best;
}

function findSimilarEntry(friendId, restaurantName) {
  const normalized = normalizeName(restaurantName);
  const mine = state.suggestions.filter(s => s.friendId === friendId);

  const exact = mine.find(s => normalizeName(s.restaurant) === normalized);
  if (exact) return { entry: exact, exact: true };

  let bestFuzzy = null, bestDist = Infinity;
  mine.forEach(s => {
    const otherNorm = normalizeName(s.restaurant);
    const dist = levenshtein(normalized, otherNorm);
    const maxLen = Math.max(normalized.length, otherNorm.length);
    if (maxLen === 0) return;
    const similarity = 1 - (dist / maxLen);
    if (similarity >= 0.8 && dist < bestDist) {
      bestDist = dist;
      bestFuzzy = s;
    }
  });
  if (bestFuzzy) return { entry: bestFuzzy, exact: false };

// Cross-friend match: is there an entry from a DIFFERENT friend, in the same city,
// that looks like the same restaurant? Used to offer merging so trust-weighted
// scoring doesn't fragment across near-duplicate spellings from different people.
function findCrossFriendMatch(cityId, restaurantName, excludeFriendId) {
  const normalized = normalizeName(restaurantName);
  const others = state.suggestions.filter(s => s.cityId === cityId && s.friendId !== excludeFriendId);

  let best = null, bestDist = Infinity;
  others.forEach(s => {
    const otherNorm = normalizeName(s.restaurant);
    const dist = levenshtein(normalized, otherNorm);
    const maxLen = Math.max(normalized.length, otherNorm.length);
    if (maxLen === 0) return;
    const similarity = 1 - (dist / maxLen);
    if (similarity >= 0.75 && dist < bestDist) {
      bestDist = dist;
      best = s;
    }
  });
  return best;
}

// The "canonical group" for scoring purposes is every suggestion sharing a canonicalId.
// Entries default to being their own group of one (canonicalId === own id) until linked.
function groupIdFor(entry) {
  return entry.canonicalId || entry.id;
}

// Photos are treated as public, restaurant-level information rather than
// something gated by trust -- the rating and note behind a photo might be
// personal, but the photo itself just shows what the food looks like, which
// is useful to anyone regardless of whether they personally trust who took
// it. This pools photoKeys across every entry sharing the same canonical
// restaurant (matching on the same mechanism Best of the Best already uses),
// deduplicated, so someone seeing a restaurant at all sees every photo
// anyone has added for it, not just the specific person's whose entry
// happened to surface it for them.
function pooledPhotosForRestaurant(entry) {
  const gid = groupIdFor(entry);
  const seen = new Set();
  const pooled = [];
  state.suggestions.forEach(s => {
    if (groupIdFor(s) !== gid) return;
    (s.photoKeys || []).forEach(key => {
      if (!seen.has(key)) { seen.add(key); pooled.push(key); }
    });
  });
  return pooled;
}

function groupMembers(entry) {
  const gid = groupIdFor(entry);
  return state.suggestions.filter(s => groupIdFor(s) === gid);
}

// Weighted average taste score across every linked entry in the group, from the
// viewer's perspective — this is what protects scoring accuracy as the board grows.
function groupWeightedScore(entry) {
  const members = groupMembers(entry).filter(s => s.ratingTaste > 0);
  if (!members.length) return null;
  let weightedSum = 0, weightTotal = 0;
  members.forEach(s => {
    const w = myTrustWeight(s.friendId) || 1;
    weightedSum += s.ratingTaste * w;
    weightTotal += w;
  });
  return weightTotal > 0 ? weightedSum / weightTotal : null;
}

// "Trending" = a restaurant where 2+ distinct people in your visible circle have
// vouched for it (via cross-friend linking), with at least one confirmation recent
// enough to matter. Surfaces group momentum that'd otherwise be buried in the board.
const TREND_WINDOW_MS = 90 * 24 * 60 * 60 * 1000;

function getTrendingGroups() {
  if (!me) return [];
  const visibleIds = visibleFriendIds();
  const visible = state.suggestions.filter(s => visibleIds.has(s.friendId));
  const seenGroupIds = new Set();
  const trending = [];

  visible.forEach(entry => {
    const gid = groupIdFor(entry);
    if (seenGroupIds.has(gid)) return;
    seenGroupIds.add(gid);

    const members = groupMembers(entry).filter(s => visibleIds.has(s.friendId));
    const distinctFriendIds = new Set(members.map(m => m.friendId));
    if (distinctFriendIds.size < 2) return;

    const mostRecentTs = Math.max(...members.map(m => m.ts));
    if (Date.now() - mostRecentTs > TREND_WINDOW_MS) return;

    const city = state.cities.find(c => c.id === entry.cityId);
    trending.push({
      entry,
      memberCount: distinctFriendIds.size,
      memberNames: members.map(m => m.friendName),
      cityName: city ? city.name : '',
      score: groupWeightedScore(entry),
      mostRecentTs
    });
  });

  trending.sort((a, b) => {
    if (b.memberCount !== a.memberCount) return b.memberCount - a.memberCount;
    return b.mostRecentTs - a.mostRecentTs;
  });

  return trending.slice(0, 5);
}

function getAvailableLeaderboardCuisines() {
  if (!me) return [];
  const visibleIds = visibleFriendIds();
  const cuisines = new Set();
  state.suggestions.forEach(s => {
    if (visibleIds.has(s.friendId) && s.cuisine && s.ratingTaste > 0) cuisines.add(s.cuisine);
  });
  return Array.from(cuisines).sort((a, b) => a.localeCompare(b));
}

function getCuisineLeaderboard(cuisine, limit) {
  if (!me || !cuisine) return [];
  const visibleIds = visibleFriendIds();
  const seenGroupIds = new Set();
  const ranked = [];

  state.suggestions.forEach(entry => {
    if (!visibleIds.has(entry.friendId)) return;
    if ((entry.cuisine || '').toLowerCase() !== cuisine.toLowerCase()) return;

    if (seenGroupIds.has(gid)) return;
    seenGroupIds.add(gid);

    const score = groupWeightedScore(entry);
    if (score === null) return;
    const city = state.cities.find(c => c.id === entry.cityId);
    ranked.push({ entry, score, cityName: city ? city.name : '' });

      (s.cuisine || '').toLowerCase() === cuisine.toLowerCase()
    );
    if (!rated.length) return;
    const friend = state.friends.find(f => f.id === friendId);
    if (!friend) return;
    results.push({
      friendId,
      name: friend.name,
      score: avg(rated.map(s => s.ratingTaste)),
      count: rated.length
    });
  });

  results.sort((a, b) => b.score - a.score);
  return results.slice(0, limit || 5);
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function queuePhotoLoad(key) {
  if (photoCache[key] !== undefined || photoLoadQueued[key]) return;
  photoLoadQueued[key] = true;
  fetch('/api/photos/' + key)
    .then(res => res.ok ? res.json() : null)
    .then(data => { photoCache[key] = data ? data.url : null; render(); })
    .catch(() => { photoCache[key] = null; render(); });
}

function uid() { return Math.random().toString(36).slice(2, 10); }

// Analytics: one storage key per event, same pattern already used for photos.
// This avoids the read-modify-write race a single shared log array would have
// if two people generate events at the same moment.
const recentEventLogAttempts = [];

async function logEvent(type, meta) {
  // Guard against flooding storage with repeated writes if something is failing
  // in a loop (e.g. a recurring page error) — cap to 20 events per rolling minute.
  const now = Date.now();
  while (recentEventLogAttempts.length && now - recentEventLogAttempts[0] > 60000) recentEventLogAttempts.shift();
  if (recentEventLogAttempts.length >= 20) return;
  recentEventLogAttempts.push(now);

  try {
    const record = { type, ts: now, friendId: me ? me.friendId : null, friendName: me ? me.name : null, meta: meta || {} };
    await window.storage.set('event:' + type + ':' + now + ':' + uid(), JSON.stringify(record), true);
  } catch (e) {
    // Analytics is best-effort and must never surface as a visible error —
    // a failed background log write has zero impact on the app actually working.
  }
}

async function loadAnalytics() {
  if (analyticsLoading) return;
  analyticsLoading = true;
  render();

  try {
    const listRes = await window.storage.list('event:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const counts = {
      signup_started: 0, signup_completed: 0,
      entry_form_started: 0, entry_form_submitted: 0,
      rec_query_started: 0, rec_query_completed: 0,
      error: 0
    };
    const recentErrors = [];

    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (!res || !res.value) continue;
        const record = JSON.parse(res.value);
        if (Object.prototype.hasOwnProperty.call(counts, record.type)) counts[record.type]++;
        if (record.type === 'error') recentErrors.push(record);
      } catch (e) {
        // A single unreadable event shouldn't block the whole dashboard.
      }
    }

    recentErrors.sort((a, b) => b.ts - a.ts);

    const signupDropoffPct = counts.signup_started > 0
      ? Math.max(0, Math.round((1 - counts.signup_completed / counts.signup_started) * 100))
      : null;
    const entryDropoffPct = counts.entry_form_started > 0
      ? Math.max(0, Math.round((1 - counts.entry_form_submitted / counts.entry_form_started) * 100))
      : null;

    analyticsData = {
      signupStarted: counts.signup_started, signupCompleted: counts.signup_completed, signupDropoffPct,
      entryStarted: counts.entry_form_started, entrySubmitted: counts.entry_form_submitted, entryDropoffPct,
      recStarted: counts.rec_query_started, recCompleted: counts.rec_query_completed,
      errorCount: counts.error, recentErrors: recentErrors.slice(0, 10),
      totalEvents: keys.length
    };
  } catch (e) {
    console.error('analytics load failed', e);
  }

  analyticsLoading = false;
  render();
}

async function submitFeedback() {
  if (feedbackSubmitting) return;
  const text = feedbackText.trim();
  if (!text) { feedbackStatus = 'Type something first.'; render(); return; }
  feedbackSubmitting = true;
  render();
  try {
    const record = {
      id: uid(), friendId: me ? me.friendId : null, friendName: me ? me.name : 'anonymous',
      text: text.slice(0, 2000), ts: Date.now()
    };
    await window.storage.set('feedback:' + Date.now() + ':' + record.id, JSON.stringify(record), true);
    feedbackText = '';
    feedbackStatus = 'Thanks — that\'s been sent.';
  } catch (e) {
    console.error('feedback submit failed', e);
    feedbackStatus = 'Couldn\'t send that — try again in a moment.';
  }
  feedbackSubmitting = false;
  render();
}

const NEARBY_MAJOR_CITY_MILES = 20;

// Finds the nearest genuinely major city within 20 miles, if any -- returns
// null rather than force a match onto every city, per the explicit
// requirement that this only shows when something real is actually nearby.
// Excludes the trivial case where the city itself basically IS the major
// city (matching by name), since "Orlando (~Orlando)" would be nonsense.
function nearbyMajorCityFor(city) {
  if (!city || typeof city.lat !== 'number' || typeof city.lon !== 'number') return null;
  const ownKey = city.name.trim().toLowerCase().replace(/[.,]/g, '');
  let nearest = null;
  let bestKm = Infinity;
  MAJOR_CITIES.forEach(([key, displayName]) => {
    if (key === ownKey) return;
    const coords = US_CITY_COORDS[key];
    if (!coords) return;
    const km = distKm(city.lat, city.lon, coords[0], coords[1]);
    if (km < bestKm) { bestKm = km; nearest = displayName; }
  });
  const milesToNearest = bestKm * 0.621371;
  return (nearest && milesToNearest <= NEARBY_MAJOR_CITY_MILES) ? nearest : null;
}

// Unified coordinate lookup: checks real, already-saved city records first
// (which may have been backfilled or geo-detected), falling back to the
// static lookup tables. This is what lets radius matching work consistently
// whether a city's coordinates came from a real saved record or a lookup.
function getCityCoords(cityName, stateName) {
  const nameKey = (cityName || '').trim().toLowerCase();
  const stateKey = (stateName || '').trim().toLowerCase();
  const savedMatch = state.cities.find(c => {
    if (c.name.trim().toLowerCase() !== nameKey) return false;
    const cState = (c.state || '').trim().toLowerCase();
    return !stateKey || !cState || cState === stateKey;
  });
  if (savedMatch && typeof savedMatch.lat === 'number' && typeof savedMatch.lon === 'number') {
    return [savedMatch.lat, savedMatch.lon];
  }
  return lookupCoords(cityName, stateName);
}

const RADIUS_MATCH_MILES = 5;
let radiusMatchCache = {};

// Given one city (name + state), returns the names of every OTHER distinct
// city that actually has restaurant data (real entries or seed picks)
// within RADIUS_MATCH_MILES -- computed from real coordinates, not asked of
// the AI as a guess. Cached per unique city per session, since this would
// otherwise be recomputed identically for every single entry sharing that
// city on every request.
function citiesWithinRadius(cityName, stateName, allCandidateCityNames) {
  const cacheKey = (cityName || '').toLowerCase() + '|' + (stateName || '').toLowerCase();
  if (radiusMatchCache[cacheKey]) return radiusMatchCache[cacheKey];

  const ownCoords = getCityCoords(cityName, stateName);
  if (!ownCoords) { radiusMatchCache[cacheKey] = []; return []; }

  const ownNameLower = (cityName || '').trim().toLowerCase();
  const nearby = [];
  const seenLower = new Set([ownNameLower]);
  allCandidateCityNames.forEach(otherName => {
    const otherLower = otherName.trim().toLowerCase();
    if (seenLower.has(otherLower)) return;
    seenLower.add(otherLower);
    const otherCoords = getCityCoords(otherName, null);
    if (!otherCoords) return;
    const miles = distKm(ownCoords[0], ownCoords[1], otherCoords[0], otherCoords[1]) * 0.621371;
    if (miles <= RADIUS_MATCH_MILES) nearby.push(otherName);
  });
  radiusMatchCache[cacheKey] = nearby;
  return nearby;
}

async function loadData() {
  try {
    const res = await window.storage.get('scout-data', true);
    if (res && res.value) {
      state = JSON.parse(res.value);
      state.cities = state.cities || [];
      state.friends = state.friends || [];
      state.suggestions = state.suggestions || [];
      // Backfill coordinates for cities that were created before their
      // coordinates existed in the lookup tables (or before a state was
      // required at all) -- without this, a city like Winter Garden, added
      // before it was in the coordinate data, would stay permanently
      // unable to participate in distance-based matching even after the
      // data gets added, since coordinates were only ever looked up once,
      // at creation time.
      state.cities.forEach(c => {
        if (typeof c.lat !== 'number' || typeof c.lon !== 'number') {
          const found = lookupCoords(c.name, c.state);
          if (found) { c.lat = found[0]; c.lon = found[1]; }
        }
      });
      state.suggestions.forEach(s => { if (typeof s.canonicalId === 'undefined') s.canonicalId = null; });
      state.friends.forEach(f => {
        if (!f.trustRatings || typeof f.trustRatings !== 'object') {
          f.trustRatings = {};
          if (Array.isArray(f.trusts)) {
            f.trusts.forEach(id => { f.trustRatings[id] = 5; });
          }
        }
        delete f.trusts;
        if (!Array.isArray(f.cuisineExpertise)) f.cuisineExpertise = [];
        if (typeof f.phone !== 'string') f.phone = null;
        if (typeof f.referredBy === 'undefined') f.referredBy = null;
        if (typeof f.isAdmin !== 'boolean') f.isAdmin = false;
      });
    }
  } catch (e) {
    state = { cities: [], friends: [], suggestions: [] };
  }
  if (state.cities.length && !selectedCityId) selectedCityId = state.cities[0].id;

  webSeedPicks = DEFAULT_WEB_SEED_PICKS.slice();
  try {
    const seedRes = await window.storage.get('seed-picks-extra', true);
    if (seedRes && seedRes.value) {
      const extra = JSON.parse(seedRes.value);
      if (Array.isArray(extra)) {
        const existingIds = new Set(webSeedPicks.map(p => p.id));
        extra.forEach(p => {
          if (p && p.id && p.restaurant && p.city && !existingIds.has(p.id)) {
            webSeedPicks.push(p);
            existingIds.add(p.id);
          }
        });
      }
    }
  } catch (e) {
    // Reading a storage key that's never been written to throws rather than
    // returning empty — expected until someone actually imports extra seed
    // picks. The fallback to DEFAULT_WEB_SEED_PICKS above already handles this
    // correctly, so this isn't worth surfacing as an alarming console error.
  }
}

async function saveData(retriesLeft) {
  if (typeof retriesLeft !== 'number') retriesLeft = 2;
  try {
    await window.storage.set('scout-data', JSON.stringify(state), true);
    return true;
  } catch (e) {
    if (retriesLeft > 0) {
      await new Promise(r => setTimeout(r, 400));
      return saveData(retriesLeft - 1);
    }
    console.error('save failed after retries', e);
    logEvent('error', { message: 'saveData failed after retries: ' + (e && e.message ? e.message : String(e)) });
    return false;
  }
}

async function exportAllData() {
  if (exportInProgress) return;
  exportInProgress = true;
  exportStatus = 'Gathering data…';
  render();

  try {
    // Pull the shared board data fresh from storage (not just in-memory state),
    // so the export reflects what's actually persisted, not unsaved local edits.
    const dataRes = await window.storage.get('scout-data', true);
    const freshState = (dataRes && dataRes.value) ? JSON.parse(dataRes.value) : { cities: [], friends: [], suggestions: [] };

    // Photos now live in R2 (independently durable object storage), not in
    // this key-value store — the export references photoKeys already
    // present on each entry, but no longer re-downloads and embeds the
    // actual image bytes, since R2 itself is the durable backup for those.
    exportStatus = 'Preparing export…';
    render();

    const exportPayload = {
      exportedAt: new Date().toISOString(),
      exportedBy: me ? me.name : 'unknown',
      formatVersion: 2,
      photosStoredSeparatelyInR2: true,
      cities: freshState.cities || [],
      friends: freshState.friends || [],
      suggestions: freshState.suggestions || []
    };

    const json = JSON.stringify(exportPayload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

async function maybeAutoSnapshot() {
  if (!isCurrentUserAdmin()) return;
  try {
    let meta = { lastSnapshotAt: 0, nextSlot: 0 };
    try {
      const res = await window.storage.get('auto-backup-meta', true);
      if (res && res.value) meta = JSON.parse(res.value);
    } catch (e) { /* never snapshotted before — use defaults */ }

    const ROUGHLY_ONE_DAY = 20 * 60 * 60 * 1000;
    if (Date.now() - (meta.lastSnapshotAt || 0) < ROUGHLY_ONE_DAY) return;

    const slot = meta.nextSlot || 0;
    const snapshot = {
      snapshotAt: Date.now(),
      cities: state.cities,
      friends: state.friends,
      suggestions: state.suggestions
    };
    const saved = await saveWithRetry('auto-backup-' + slot, JSON.stringify(snapshot), true);
    if (saved) {
      meta.lastSnapshotAt = Date.now();
      meta.nextSlot = (slot + 1) % 3;
      await saveWithRetry('auto-backup-meta', JSON.stringify(meta), true);
    }
  } catch (e) {
    console.error('auto snapshot failed', e);
  }
}

async function saveWithRetry(key, value, shared, retriesLeft) {
  if (typeof retriesLeft !== 'number') retriesLeft = 2;
  try {
    await window.storage.set(key, value, shared);
    return true;
  } catch (e) {
    if (retriesLeft > 0) {
      await new Promise(r => setTimeout(r, 400));
      return saveWithRetry(key, value, shared, retriesLeft - 1);
    }
    return false;
  }
}

async function confirmDataImport() {
  const parsed = pendingDataImport;
  if (!parsed) return;
  pendingDataImport = null;
  dataImportInProgress = true;
  render();

  try {
    // Capture identifying info from the CURRENT (pre-restore) account, so we can
    // try to reunite this session with a matching old identity in the backup —
    // otherwise a restore after a fresh start leaves the person's own historical
    // entries and trust ratings invisible to them, even though the data is there.
    let myPreRestorePhone = null;
    let myPreRestoreName = me ? me.name : null;
    if (me) {
      const currentMe = state.friends.find(f => f.id === me.friendId);
      if (currentMe) myPreRestorePhone = currentMe.phone || null;
    }

    state.cities = parsed.cities;
    state.friends = parsed.friends;
    state.suggestions = parsed.suggestions;

    // Only an admin can trigger a restore in the first place — guarantee they
    // remain a valid, admin account afterward, even if the restored backup
    // predates their current session and would otherwise leave them orphaned
    // (their friendId matching nothing in the newly-restored data).
    let identityOutcome = 'unchanged';
    if (me) {
      let myFriend = null;
      let matchedBy = null;
      if (myPreRestorePhone) { myFriend = state.friends.find(f => f.phone && f.phone === myPreRestorePhone); if (myFriend) matchedBy = 'phone'; }
      if (!myFriend && myPreRestoreName) { myFriend = state.friends.find(f => f.name && f.name.toLowerCase() === myPreRestoreName.toLowerCase()); if (myFriend) matchedBy = 'name'; }
      if (!myFriend) { myFriend = state.friends.find(f => f.id === me.friendId); if (myFriend) matchedBy = 'same-id'; }

      if (myFriend && myFriend.id !== me.friendId) {
        // Reunited with an old identity from the backup — adopt it so historical
        // trust ratings and authored entries become visible again immediately.
        me.friendId = myFriend.id;
        me.name = myFriend.name;
        await saveIdentity();
        identityOutcome = 'reunited-by-' + matchedBy;
      } else if (!myFriend) {
        myFriend = { id: me.friendId, name: me.name, trustRatings: {}, cuisineExpertise: [], referredBy: null, phone: null };
        state.friends.push(myFriend);
        identityOutcome = 'new-account-no-match-found';
      } else {
        identityOutcome = 'already-matched';
      }
      const perms = getAdminPermissions(myFriend);
      ADMIN_PERMISSIONS.forEach(p => { perms[p] = true; });
    }

    const saved = await saveWithRetry('scout-data', JSON.stringify(state), true);
    if (!saved) throw new Error('Could not save restored data after retries.');

    let photosRestored = 0;
    let photosFailed = 0;
    if (parsed.photos && typeof parsed.photos === 'object') {
      for (const key of Object.keys(parsed.photos)) {
        const ok = await saveWithRetry(key, parsed.photos[key], true);
        if (ok) photosRestored++; else photosFailed++;
      }
    }

    webSeedPicks = DEFAULT_WEB_SEED_PICKS.slice();
    try {
      const seedRes = await window.storage.get('seed-picks-extra', true);
      if (seedRes && seedRes.value) {
        const extra = JSON.parse(seedRes.value);
        if (Array.isArray(extra)) {
          const existingIds = new Set(webSeedPicks.map(p => p.id));
          extra.forEach(p => { if (p && p.id && !existingIds.has(p.id)) { webSeedPicks.push(p); existingIds.add(p.id); } });
        }
      }
    } catch (e) { /* no extra seed picks yet, that's fine */ }

    const identityNote = identityOutcome === 'reunited-by-phone' ? ' Your session was reunited with your existing account (matched by phone) — your old entries and trust ratings should now be visible.'
      : identityOutcome === 'reunited-by-name' ? ' Your session was reunited with your existing account (matched by name) — your old entries and trust ratings should now be visible.'
      : identityOutcome === 'new-account-no-match-found' ? ' Warning: no matching account for you was found in this backup (checked by phone and name) — a new blank account was created for you instead, so your own old entries may still be invisible until you re-rate people in your trust circle.'
      : '';
    dataImportStatus = 'Restored ' + parsed.suggestions.length + ' entries, ' + parsed.friends.length + ' people, and ' + photosRestored + ' photos.' + (photosFailed > 0 ? ' (' + photosFailed + ' photo(s) failed to restore — try importing again.)' : '') + identityNote;
    dataImportText = '';
  } catch (e) {
    console.error('data import failed', e);
    dataImportStatus = 'Import failed: ' + (e && e.message ? e.message : String(e)) + ' — try again in a moment.';
  }

  dataImportInProgress = false;
  render();
}

function uidFromString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0; }
  return Math.abs(hash).toString(36);
}

async function importSeedPicks() {
  if (seedImportInProgress) return;
  const raw = seedImportText.trim();
  if (!raw) { seedImportStatus = 'Paste some JSON first.'; render(); return; }

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    seedImportStatus = 'That\'s not valid JSON — check for a stray comma or missing bracket.';
    render();
    return;
  }
  if (!Array.isArray(parsed)) {
    seedImportStatus = 'Expected a JSON array of restaurant objects, e.g. [{"city": "...", "restaurant": "...", "cuisine": "...", "note": "..."}].';
    render();
    return;
  }

  const cleaned = [];
  const errors = [];
  parsed.forEach((item, i) => {
    if (!item || typeof item !== 'object') { errors.push('Item ' + (i + 1) + ': not an object.'); return; }
    if (!item.city || !item.restaurant) { errors.push('Item ' + (i + 1) + ' (' + (item.restaurant || 'unnamed') + '): missing city or restaurant.'); return; }
    const id = item.id || ('seed-import-' + uidFromString(item.city + '|' + item.restaurant));
    cleaned.push({
      id: id,
      city: String(item.city).trim(),
      restaurant: String(item.restaurant).trim(),
      cuisine: item.cuisine ? String(item.cuisine).trim() : 'unspecified',
      cost: (typeof item.cost === 'number' && item.cost >= 0 && item.cost <= 4) ? item.cost : 0,
      note: item.note ? String(item.note).trim() : ''
    });
  });

  if (!cleaned.length) {
    seedImportStatus = 'Nothing valid to import.' + (errors.length ? ' ' + errors.slice(0, 3).join(' ') : '');
    render();
    return;
  }

  seedImportInProgress = true;
  render();

  try {
    let existing = [];
    try {
      const existingRes = await window.storage.get('seed-picks-extra', true);
      if (existingRes && existingRes.value) {
        existing = JSON.parse(existingRes.value);
        if (!Array.isArray(existing)) existing = [];
      }
    } catch (e) {
      // A key that's never been written to throws rather than returning empty —
      // completely expected the first time anyone ever imports seed picks.
      existing = [];
    }

    const existingIds = new Set(existing.map(p => p.id));
    let addedCount = 0, updatedCount = 0;
    cleaned.forEach(item => {
      const idx = existing.findIndex(p => p.id === item.id);
      if (idx >= 0) { existing[idx] = item; updatedCount++; }
      else { existing.push(item); addedCount++; }
    });

    let writeOk = false;
    for (let attempt = 0; attempt < 3 && !writeOk; attempt++) {
      try {
        await window.storage.set('seed-picks-extra', JSON.stringify(existing), true);
        writeOk = true;
      } catch (e) {
        if (attempt < 2) await new Promise(r => setTimeout(r, 400));
        else throw e;
      }
    }

    const defaultIds = new Set(DEFAULT_WEB_SEED_PICKS.map(p => p.id));
    webSeedPicks = DEFAULT_WEB_SEED_PICKS.slice();
    existing.forEach(p => { if (!defaultIds.has(p.id)) webSeedPicks.push(p); });

    seedImportStatus = 'Imported ' + addedCount + ' new and updated ' + updatedCount + ' existing seed picks.' + (errors.length ? ' Skipped ' + errors.length + ' invalid item(s).' : '');
    seedImportText = '';
  } catch (e) {
    console.error('seed import failed after retries', e);
    logEvent('error', { message: 'seed import failed after retries: ' + (e && e.message ? e.message : String(e)) });
    seedImportStatus = 'Import failed — try again in a moment.';
  }

  seedImportInProgress = false;
  render();
}

function normalizePhone(phone) {
  return (phone || '').replace(/\D/g, '');
}

async function signIn(firstName, middleInitial, lastName, phone, cuisines) {
  const first = (firstName || '').trim();
  const mi = (middleInitial || '').trim().replace(/[^a-zA-Z]/g, '').slice(0, 1);
  const last = (lastName || '').trim();
  const phoneDigits = normalizePhone(phone);

  if (!first || !last) { signupError = 'First and last name are required.'; return false; }
  if (phoneDigits.length < 7) { signupError = 'Enter a valid phone number.'; return false; }

  const fullName = first + (mi ? ' ' + mi.toUpperCase() + '.' : '') + ' ' + last;

  let existing = state.friends.find(f => f.phone && f.phone === phoneDigits);
  if (!existing) {
    existing = state.friends.find(f => !f.phone && f.name.toLowerCase() === fullName.toLowerCase());
    if (existing) existing.phone = phoneDigits;
  }

  if (existing) {
    me = { friendId: existing.id, name: existing.name, lastVisitTs: Date.now(), plannedVisits: [], jumpstartBatchIndex: 1, hasUsedJumpstart: false };
    previousVisitTs = Date.now();
    setCardExpansionDefaults();
  } else {
    const id = uid();
    const newFriend = {
      id, name: fullName, firstName: first, middleInitial: mi.toUpperCase(), lastName: last, phone: phoneDigits,
      trustRatings: {}, cuisineExpertise: Array.isArray(cuisines) ? cuisines.slice() : [],
      referredBy: (inviterFriendId && inviterFriendId !== id) ? inviterFriendId : null
    };
    state.friends.push(newFriend);
    const saved = await saveData();
    if (!saved) {
      state.friends = state.friends.filter(f => f.id !== id);
      signupError = 'Couldn\'t save your account — check your connection and try again.';
      return false;
    }
    me = { friendId: id, name: fullName, lastVisitTs: Date.now(), plannedVisits: [], jumpstartBatchIndex: 1, hasUsedJumpstart: false };
    previousVisitTs = Date.now();
    trustCardExpanded = true;
    cuisineCardExpanded = false;

    if (inviterFriendId && inviterFriendId !== id) {
      const inviter = state.friends.find(f => f.id === inviterFriendId);
      if (inviter && inviter.trustRatings) {
        const candidates = Object.keys(inviter.trustRatings).filter(fid => fid !== id && inviter.trustRatings[fid] > 0);
        if (candidates.length) {
          showQuickConnect = true;
          quickConnectInviterId = inviterFriendId;
          quickConnectSelections = {};
          candidates.forEach(fid => { quickConnectSelections[fid] = true; });
        }
      }
    }
  }
  signupCuisines = [];
  signupFirstName = '';
  signupMiddleInitial = '';
  signupLastName = '';
  signupPhone = '';
  signupError = '';
  signupStartedLogged = false;
  logEvent('signup_completed', { isNewAccount: !existing });
  saveIdentity();
  await applyAdminBootstrapIfRequested();
  render();
  return true;
}

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function tryGeolocate() {
  if (!navigator.geolocation) return;
  const withCoords = state.cities.filter(c => typeof c.lat === 'number' && typeof c.lon === 'number');
  if (!withCoords.length) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      let nearest = null, best = Infinity;
      withCoords.forEach(c => {
        const d = distKm(pos.coords.latitude, pos.coords.longitude, c.lat, c.lon);
        if (d < best) { best = d; nearest = c; }
      });
      if (nearest) {
        geoDetectedCityId = nearest.id;
        selectedCityId = nearest.id;
        render();
      }
    },
    () => {},
    { timeout: 5000 }
  );
}

function isOutsideExpertise(e) {
  if (!e.cuisine) return false;
  const suggester = state.friends.find(f => f.id === e.friendId);
  if (!suggester || !Array.isArray(suggester.cuisineExpertise) || !suggester.cuisineExpertise.length) return false;
  return !suggester.cuisineExpertise.some(c => c.toLowerCase() === e.cuisine.toLowerCase());
}

function getJumpstartInfo() {
  if (!me) return null;
  const myFriend = state.friends.find(f => f.id === me.friendId);
  if (!myFriend) return null;
  const myRatings = myTrustRatings();

  // Source pool: everyone you already trust, plus your referrer even if you
  // haven't rated them yet (they vouched for you, so their circle is a
  // reasonable starting point regardless).
  const sourceIds = new Set(Object.keys(myRatings).filter(fid => myRatings[fid] > 0));
  if (myFriend.referredBy) sourceIds.add(myFriend.referredBy);
  if (!sourceIds.size) return null;

  // Never show anyone's specific trust number here (could cause hurt feelings) —
  // just track who among your connections vouches for each candidate, and
  // silently average their ratings for the value actually applied if selected.
  const candidateInfo = {};
  sourceIds.forEach(sourceId => {
    if (sourceId === me.friendId) return;
    const source = state.friends.find(f => f.id === sourceId);
    if (!source || !source.trustRatings) return;
    Object.keys(source.trustRatings).forEach(candidateId => {
      if (candidateId === me.friendId) return;
      if (source.trustRatings[candidateId] <= 0) return;
      if ((myRatings[candidateId] || 0) > 0) return;
      if (!candidateInfo[candidateId]) candidateInfo[candidateId] = { sourceNames: [], ratings: [] };
      candidateInfo[candidateId].sourceNames.push(source.name);
      candidateInfo[candidateId].ratings.push(source.trustRatings[candidateId]);
    });
  });

  const allCandidateIds = Object.keys(candidateInfo);
  if (!allCandidateIds.length) return null;

  // Sort by connection strength before batching, so the most relevant
  // discoveries surface first at scale -- someone vouched for by many of
  // your trusted connections should reliably beat someone vouched for by
  // just one, rather than it coming down to arbitrary alphabetical luck.
  // Primary signal: how many people vouch for them. Tiebreaker: the average
  // trust rating those vouchers gave them.
  const byStrength = allCandidateIds.slice().sort((a, b) => {
    const infoA = candidateInfo[a], infoB = candidateInfo[b];
    if (infoB.sourceNames.length !== infoA.sourceNames.length) {
      return infoB.sourceNames.length - infoA.sourceNames.length;
    }
    const avgA = infoA.ratings.reduce((s, r) => s + r, 0) / infoA.ratings.length;
    const avgB = infoB.ratings.reduce((s, r) => s + r, 0) / infoB.ratings.length;
    return avgB - avgA;
  });

  const BATCH_SIZE = 25;
  let candidateIds = byStrength;
  if (byStrength.length > BATCH_SIZE) {
    // Rotate through fixed-size windows of the strength-ordered list, so
    // repeat visits still surface fresh (but still well-ranked) people
    // rather than only ever showing the same top 25 forever.
    const offset = (me.jumpstartBatchIndex || 0) % byStrength.length;
    candidateIds = [];
    for (let i = 0; i < BATCH_SIZE; i++) {
      candidateIds.push(byStrength[(offset + i) % byStrength.length]);
    }
  }
  return { candidateInfo, candidateIds, totalCandidateCount: allCandidateIds.length };
}

function myTrustRatings() {
  if (!me) return {};
  const friend = state.friends.find(f => f.id === me.friendId);
  return (friend && friend.trustRatings) ? friend.trustRatings : {};
}

function myTrustRating(targetId) {
  return myTrustRatings()[targetId] || 0;
}

// Second-degree weight is discounted so it can never reach a first-degree rating
// even at max trust on both hops (5 * 5 discounted by 0.6 -> caps at 3).
const SECOND_DEGREE_DISCOUNT = 0.6;

function myTrustInfo(friendId) {
  if (!me) return { weight: 0, degree: 0, via: null };
  if (friendId === me.friendId) return { weight: 5, degree: 0, via: null };

  const direct = myTrustRating(friendId);
  if (direct > 0) return { weight: direct, degree: 1, via: null };

  const ratings = myTrustRatings();
  let best = { weight: 0, degree: 0, via: null };
  Object.keys(ratings).forEach(intermediaryId => {
    const w1 = ratings[intermediaryId];
    if (w1 <= 0 || intermediaryId === friendId) return;
    const intermediary = state.friends.find(f => f.id === intermediaryId);
    if (!intermediary || !intermediary.trustRatings) return;
    const w2 = intermediary.trustRatings[friendId] || 0;
    if (w2 <= 0) return;
    const effective = Math.max(1, Math.round(Math.min(w1, w2) * SECOND_DEGREE_DISCOUNT));
    if (effective > best.weight) best = { weight: effective, degree: 2, via: intermediary.name };
  });
  return best;
}

function myTrustWeight(friendId) {
  return myTrustInfo(friendId).weight;
}

function visibleFriendIds() {
  const ids = new Set();
  if (!me) return ids;
  ids.add(me.friendId);
  state.friends.forEach(f => {
    if (f.id === me.friendId) return;
    if (myTrustInfo(f.id).weight > 0) ids.add(f.id);
  });
  return ids;
}

function visibleSuggestions() {
  const ids = visibleFriendIds();
  return state.suggestions.filter(s => ids.has(s.friendId));
}

function avg(nums) {
  if (!nums.length) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function friendTrackRecord(friendId, cuisine) {
  const rated = state.suggestions.filter(s => s.friendId === friendId && s.ratingTaste > 0);
  if (!rated.length) return { score: null, basis: 'none', n: 0 };
  if (cuisine) {
    const sameCuisine = rated.filter(s => (s.cuisine || '').toLowerCase() === cuisine.toLowerCase());
    if (sameCuisine.length) {
      return { score: avg(sameCuisine.map(s => s.ratingTaste)), basis: 'cuisine', n: sameCuisine.length };
    }
  }
  return { score: avg(rated.map(s => s.ratingTaste)), basis: 'overall', n: rated.length };
}

function roundHalf(n) { return Math.round(n * 10) / 10; }

function timeAgo(ts) {
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' minute' + (mins === 1 ? '' : 's') + ' ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' hour' + (hours === 1 ? '' : 's') + ' ago';
  const days = Math.floor(hours / 24);
  return days + ' day' + (days === 1 ? '' : 's') + ' ago';
}

function trackLabel(record) {
  if (record.basis === 'none') return 'no track record yet';
  if (record.basis === 'cuisine') return roundHalf(record.score) + ' taste avg on this cuisine (' + record.n + ' rated)';
  return roundHalf(record.score) + ' taste avg overall (' + record.n + ' rated)';
}

function costLabel(cost) {
  return cost > 0 ? '$'.repeat(cost) : '';
}

function renderFriendSearchResults(others, visibleIds, unknownMarks) {
  const query = friendSearchQuery.trim().toLowerCase();
  if (!query) return '';
  const matches = others.filter(f => !visibleIds.has(f.id) && !unknownMarks[f.id] && f.name.toLowerCase().includes(query)).slice(0, 8);
  if (!matches.length) {
    // Not actually a broken search -- this box is specifically for finding
    // someone NOT already visible, to add them for the first time. If the
    // query matches someone who's already in the list above (already rated,
    // or already surfaced through jumpstart/a previous search), a bare "No
    // matches" reads as a bug rather than "they're already right there" --
    // check for that specific case and say so plainly instead of leaving
    // the person confused about whether the search itself is broken.
    const alreadyVisibleMatch = others.find(f => visibleIds.has(f.id) && f.name.toLowerCase().includes(query));
    if (alreadyVisibleMatch) {
      return '<p class="hint" style="margin:6px 0 0;">' + escapeHtml(alreadyVisibleMatch.name) + ' is already in your list above.</p>';
    }
    return '<p class="hint" style="margin:6px 0 0;">No matches.</p>';
  }
  let html = '<div class="group-pick-suggestions" style="margin-top:6px;">';
  matches.forEach(f => {
    html += '<div class="group-pick-suggestion-row" data-friend-search-add="' + f.id + '"><span class="avatar-sm">' + escapeHtml(f.name.charAt(0).toUpperCase()) + '</span>' + escapeHtml(f.name) + '<span class="add-hint">TAP TO ADD</span></div>';
  });
  html += '</div>';
  return html;
}

function updateFriendSearchResults() {

  const others = state.friends.filter(f => f.id !== me.friendId);

  container.innerHTML = renderFriendSearchResults(others, visibleIds, unknownMarks);
  attachFriendSearchHandlers();
}

function renderTrustCard() {
  if (!me) return '';

    jumpstartHtml += '<p class="hint" style="margin:0 0 10px;">People trusted by connections you already have — select any to add them to your own circle.' + (totalCandidateCount > candidateIds.length ? ' Showing ' + candidateIds.length + ' of ' + totalCandidateCount + ' — a fresh set rotates in each time you log on.' : '') + '</p>';
    candidateIds.forEach(fid => {
      const candidate = state.friends.find(f => f.id === fid);
      if (!candidate) return;
      const checked = !!referrerJumpstartSelections[fid];
      const sourceNames = [...new Set(candidateInfo[fid].sourceNames)];
      const viaLabel = sourceNames.length > 2
        ? sourceNames.slice(0, 2).join(', ') + ' + ' + (sourceNames.length - 2) + ' more'

      jumpstartHtml += '<label class="group-pick-row"><input type="checkbox" data-jumpstart-toggle="' + fid + '"' + (checked ? ' checked' : '') + '> ' + escapeHtml(candidate.name) + ' <span class="track-record">(via ' + escapeHtml(viaLabel) + ')</span></label>';
    });
    jumpstartHtml += '<div class="actions" style="margin-top:10px;"><button class="btn btn-primary btn-small" id="jumpstart-add">Add selected to my circle</button></div>';
    jumpstartHtml += '</div>';
  }

  const showJumpstartAtTop = jumpstartHtml && !(me.hasUsedJumpstart);
  if (showJumpstartAtTop) html += jumpstartHtml;

  if (!others.length) {
    html += '<p class="empty">No one else has joined yet — once friends sign in, they\'ll appear here to rate.</p>';
  } else {
    const myFriendRecord = state.friends.find(f => f.id === me.friendId);
    const unknownMarks = (myFriendRecord && myFriendRecord.unknownMarks) || {};
    const jumpstartIds = new Set(jumpstartInfo ? jumpstartInfo.candidateIds : []);
    // Default visible set: people already trusted (naturally the ones
    // worth seeing again), plus anyone surfaced through the jumpstart
    // suggestions, plus anyone explicitly found and added via search this
    // session. Not literally everyone in the app -- at any real scale that
    // becomes the same unusable wall of names the admin and account-claim
    // screens had, and it's also just not how someone naturally finds a
    // specific person, the same way Facebook's friend list isn't "rate
    // every single person on the platform."
    const alreadyRatedIds = new Set(others.filter(f => (ratings[f.id] || 0) > 0).map(f => f.id));
    const defaultVisibleIds = new Set([...alreadyRatedIds, ...jumpstartIds, ...friendSearchAddedIds]);
    const toRate = others.filter(f => !unknownMarks[f.id] && defaultVisibleIds.has(f.id));
    const markedUnknown = others.filter(f => unknownMarks[f.id]);

    if (!toRate.length) {
      html += '<p class="empty">Search below to find and add specific people to rate.</p>';
    }
    toRate.forEach(f => {
      const rating = ratings[f.id] || 0;
      html += '<div class="friend-row" data-rate-friend-row="' + f.id + '"><span class="friend-name">' + escapeHtml(f.name) + '</span><div class="rate-dots">';
      for (let i = 1; i <= 5; i++) {

      }
      html += '</div></div>';
      if (rating === 0) {
        html += '<div style="text-align:right; margin:-4px 0 6px;"><button type="button" class="btn-text-link" data-mark-unknown="' + f.id + '" style="background:none; border:none; font-size:11px; color:var(--text-on-paper-dim); text-decoration:underline; cursor:pointer; padding:0;">I don\'t know them</button></div>';
      }
    });

    html += '<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">';
    html += '<label for="friend-search-input" style="font-size:12.5px; font-weight:600;">Find and add someone</label>';
    html += '<input type="text" id="friend-search-input" placeholder="Type a name to search…" value="' + escapeHtml(friendSearchQuery) + '" style="margin-top:6px;">';
    html += '<div id="friend-search-results">' + renderFriendSearchResults(others, defaultVisibleIds, unknownMarks) + '</div>';
    html += '</div>';

    if (markedUnknown.length) {
      html += renderCollapsibleWrapper('unknown-people', 'People you don\'t know (' + markedUnknown.length + ')', markedUnknown.map(f =>
        '<div class="friend-row"><span class="friend-name" style="opacity:0.6;">' + escapeHtml(f.name) + '</span><button type="button" class="btn btn-ghost btn-small" data-unmark-unknown="' + f.id + '">Undo</button></div>'
      ).join(''), true);
    }
  }
  if (jumpstartHtml && !showJumpstartAtTop) {
    html += '<div class="section-label" style="margin:20px 0 10px;">Discovered through your circle</div>';
    html += jumpstartHtml;
  }
  html += '</div>';
  return html;
}

  const cleanupQuery = cleanupSearchQuery.trim().toLowerCase();
  const cleanupFiltered = cleanupQuery ? others.filter(f => f.name.toLowerCase().includes(cleanupQuery)) : others;
  const selectedCount = Object.values(cleanupSelections).filter(Boolean).length;
  if (others.length > 5) {
    html += '<input type="text" id="cleanup-search" placeholder="Search by name" value="' + escapeHtml(cleanupSearchQuery) + '" style="margin-bottom:10px;">';
  }
  if (!others.length) {
    html += '<p class="empty">No other accounts to clean up yet.</p>';
  } else if (!cleanupFiltered.length) {
    html += '<p class="empty">No one matches "' + escapeHtml(cleanupSearchQuery) + '".</p>';
  } else {
    if (cleanupQuery) html += '<p class="hint" style="margin-bottom:8px;">Showing ' + cleanupFiltered.length + ' of ' + others.length + '.</p>';
    cleanupFiltered.forEach(f => {
      const entryCount = state.suggestions.filter(s => s.friendId === f.id).length;
      const checked = !!cleanupSelections[f.id];
      html += '<label class="group-pick-row"><input type="checkbox" data-cleanup-toggle="' + f.id + '"' + (checked ? ' checked' : '') + '> ' + escapeHtml(f.name) + ' <span class="track-record">(' + entryCount + ' ' + (entryCount === 1 ? 'entry' : 'entries') + (friendHasAnyAdminAccess(f) ? ', admin' : '') + ')</span></label>';
    });
    html += '<div class="actions" style="margin-top:10px;"><button class="btn btn-ghost btn-small" id="cleanup-stage-btn">Delete selected accounts' + (selectedCount ? ' (' + selectedCount + ')' : '') + '</button><span class="msg' + (cleanupStatus ? ' msg-success' : '') + '" id="cleanup-status-msg">' + escapeHtml(cleanupStatus) + '</span></div>';
  }
  html += '</div>';
  return html;
}

function stageCleanup() {
  const selectedIds = Object.keys(cleanupSelections).filter(id => cleanupSelections[id]);
  if (!selectedIds.length) { cleanupStatus = 'Select at least one account first.'; render(); return; }
  pendingCleanupConfirm = selectedIds;
  cleanupStatus = '';
  render();
}

function cancelCleanup() {
  pendingCleanupConfirm = null;
  render();
}

async function confirmCleanup() {
  if (!pendingCleanupConfirm) return;
  const idsToDelete = new Set(pendingCleanupConfirm);
  pendingCleanupConfirm = null;

  state.suggestions = state.suggestions.filter(s => !idsToDelete.has(s.friendId));
  state.friends = state.friends.filter(f => !idsToDelete.has(f.id));
  state.friends.forEach(f => {
    if (f.trustRatings) {
      idsToDelete.forEach(id => { delete f.trustRatings[id]; });
    }
    if (f.referredBy && idsToDelete.has(f.referredBy)) f.referredBy = null;
  });

  const deletedCount = idsToDelete.size;
  cleanupSelections = {};
  const saved = await saveData();
  cleanupStatus = saved
    ? 'Deleted ' + deletedCount + ' account(s) and their entries.'
    : 'Deletion applied locally but failed to save — try again.';
  render();
}

function generateTopPicksText(limit) {
  if (!me) return '';
  const ids = visibleFriendIds();
  const candidates = state.suggestions
    .filter(s => ids.has(s.friendId) && s.ratingTaste > 0)
    .map(e => {
      const weight = myTrustWeight(e.friendId) || 1;
      return { e, score: e.ratingTaste * weight };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, limit || 5);

  if (!candidates.length) return '';

  const lines = candidates.map(({ e }, i) => {
    const city = state.cities.find(c => c.id === e.cityId);
    const cityName = city ? city.name : '';
    return (i + 1) + '. ' + e.restaurant + (e.cuisine ? ' (' + e.cuisine + ')' : '') + (cityName ? ' — ' + cityName : '') + ' — ' + '\u2605'.repeat(e.ratingTaste) + '\u2606'.repeat(5 - e.ratingTaste);
  });

  const baseUrl = window.location.origin + window.location.pathname;
  const link = baseUrl + '?ref=' + encodeURIComponent(me.friendId);

  return me.name + '\u2019s top trusted picks:\n\n' + lines.join('\n') + '\n\nFrom Nate-Worthy — ' + link;
}

              photos.forEach(key => {
                if (photoCache[key]) {
                  html += '<img class="entry-photo-thumb" src="' + photoCache[key] + '" alt="Photo of ' + escapeHtml(suggestion.restaurant) + '">';
                } else {
                  html += '<div class="entry-photo-loading"></div>';
                  queuePhotoLoad(key);
                }
              });
              html += '</div>';
            }
          })();
          if (suggestion.friendId !== me.friendId) {
            html += '<button class="btn btn-ghost btn-small" data-mark-going="friend:' + escapeHtml(suggestion.id) + '" style="margin-top:8px;">I\'m going here</button>';
          }
          html += '</div>';
        } else if (source === 'community') {
          const first = communityGroup[0];
          const city = state.cities.find(c => c.id === first.cityId);
          const ratingLabel = communityAvgRating !== null ? communityAvgRating.toFixed(1) + '/5' : 'not yet rated';
          const raterLabel = communityRaterCount + (communityRaterCount === 1 ? ' community pick' : ' community picks');
          html += '<div class="rec-pick">';
          html += '<p class="rec-pick-title">' + escapeHtml(first.restaurant) + (first.cost ? ' <span class="cost-tag">' + costLabel(first.cost) + '</span>' : '') + '<span class="community-source-tag">Community, ' + escapeHtml(ratingLabel) + ' (' + raterLabel + ')</span></p>';
          html += '<p class="rec-pick-meta">' + escapeHtml(first.cuisine || 'unspecified') + (city ? ' — ' + escapeHtml(city.name) : '') + '</p>';
          html += '<p class="rec-pick-reason">' + escapeHtml(reason) + '</p>';
          (function() {
            const photos = pooledPhotosForRestaurant(first).slice(0, 4);
            if (photos.length) {
              html += '<div class="entry-photos">';
              photos.forEach(key => {
                if (photoCache[key]) {
                  html += '<img class="entry-photo-thumb" src="' + photoCache[key] + '" alt="Photo of ' + escapeHtml(first.restaurant) + '">';
                } else {
                  html += '<div class="entry-photo-loading"></div>';
                  queuePhotoLoad(key);
                }
              });
              html += '</div>';
            }
          })();
          html += '<button class="btn btn-ghost btn-small" data-mark-going="friend:' + escapeHtml(first.id) + '">I\'m going here</button>';
          html += '</div>';
        } else {
          html += '<div class="rec-pick">';
          html += '<p class="rec-pick-title">' + escapeHtml(webPick.restaurant) + (webPick.cost ? ' <span class="cost-tag">' + costLabel(webPick.cost) + '</span>' : '') + '<span class="web-source-tag">Internet match, not a friend</span></p>';
          html += '<p class="rec-pick-meta">' + escapeHtml(webPick.cuisine || 'unspecified') + ' — ' + escapeHtml(webPick.city) + '</p>';
          html += '<p class="rec-pick-reason">' + escapeHtml(reason) + '</p>';
          html += '<div style="display:flex; gap:8px; margin-top:8px;">';
          html += '<button class="btn btn-ghost btn-small" data-claim-seed="' + escapeHtml(webPick.id) + '">Rate this yourself</button>';
          html += '<button class="btn btn-ghost btn-small" data-mark-going="web:' + escapeHtml(webPick.id) + '">I\'m going here</button>';
          html += '</div>';
          html += '</div>';
        }
      });
      if (recResultsShownCount < recResults.length) {
        const remaining = recResults.length - recResultsShownCount;
        const nextBatch = Math.min(5, remaining);
        html += '<div class="show-more-wrap"><button type="button" class="show-more-btn" id="rec-show-more">Show ' + nextBatch + ' more option' + (nextBatch === 1 ? '' : 's') + '</button><p class="show-more-hint">' + remaining + ' more available</p></div>';
      }
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderShareCard() {
  const baseUrl = window.location.origin + window.location.pathname;
  const shareUrl = me ? (baseUrl + '?ref=' + encodeURIComponent(me.friendId)) : baseUrl;

  let html = '<div class="card share-card">';
  html += '<h2>Share</h2>';

  if (me) {
    html += '<div class="share-tabs">';
    html += '<button class="share-tab' + (shareCardMode === 'link' ? ' active' : '') + '" data-share-tab="link">Invite link</button>';
    if (isCurrentUserAdmin()) {
      html += '<button class="share-tab' + (shareCardMode === 'open' ? ' active' : '') + '" data-share-tab="open">Invite a stranger</button>';
    }
    html += '<button class="share-tab' + (shareCardMode === 'picks' ? ' active' : '') + '" data-share-tab="picks">My top picks</button>';
    html += '</div>';
  }

  if (!me || shareCardMode === 'link') {
    html += '<p class="hint">' + (me ? 'This link is tagged with your account, so anyone who joins through it can quickly add people from your trust circle to their own. ' : '') + 'This only works if everyone adds and rates spots — send this link to the people whose taste you trust.</p>';
    html += '<div class="share-row">';
    html += '<input type="text" id="share-link" readonly value="' + escapeHtml(shareUrl) + '">';
    html += '<button class="btn btn-ghost btn-small" id="copy-link-btn">Copy link</button>';
    html += '</div>';
    html += '<span class="msg" id="share-msg"></span>';
    if (me) {
      const referred = state.friends.filter(f => f.referredBy === me.friendId);
      if (referred.length > 0) {
        html += '<p class="track-record" style="margin-top:10px;">' + referred.length + ' ' + (referred.length === 1 ? 'person has' : 'people have') + ' joined through your link:</p>';
        const myRatings = myTrustRatings();
        referred.forEach(f => {
          const rating = myRatings[f.id] || 0;
          html += '<div class="friend-row"><span class="friend-name">' + escapeHtml(f.name) + '</span><span class="track-record">' + (rating > 0 ? '\u2605'.repeat(rating) + '\u2606'.repeat(5 - rating) : 'not yet rated') + '</span></div>';
        });
      }
    }
  } else if (shareCardMode === 'open' && isCurrentUserAdmin()) {
    const openUrl = window.location.origin + window.location.pathname;
    html += '<p class="hint">A plain link with no referral tag, meant for posting somewhere public — Facebook, a community group, anywhere you don\'t personally know who\'ll see it. Nobody who joins through this is connected to you, your trust circle stays completely private from them, and it won\'t show up in your "joined through your link" list. Admin-only, since a broadcast link reaches people you have no personal relationship with at all.</p>';
    html += '<div class="share-row">';
    html += '<input type="text" id="open-share-link" readonly value="' + escapeHtml(openUrl) + '">';
    html += '<button class="btn btn-ghost btn-small" id="copy-open-link-btn">Copy link</button>';
    html += '</div>';
    html += '<span class="msg" id="open-share-msg"></span>';
  } else {
    const preview = generateTopPicksText(5);
    if (!preview) {
      html += '<p class="empty">Rate a few restaurants first, then your top picks will show up here to share.</p>';
    } else {
      html += '<p class="hint">A quick, shareable snapshot of your highest-rated trusted picks — good for texting to someone outside the app entirely.</p>';
      html += '<textarea id="top-picks-preview" readonly style="min-height:120px; font-size:13px; background:rgba(34,51,63,0.03);">' + escapeHtml(preview) + '</textarea>';
      html += '<div class="actions"><button class="btn btn-ghost btn-small" id="copy-top-picks-btn">Copy my top picks</button><span class="msg" id="top-picks-msg"></span></div>';
    }
  }

  html += '</div>';
  return html;
}

    html += '<input type="text" id="signin-last" placeholder="Last" value="' + escapeHtml(signupLastName) + '">';
    html += '<label for="signin-phone">Phone number</label>';
    html += '<input type="tel" id="signin-phone" placeholder="(555) 555-5555" value="' + escapeHtml(signupPhone) + '">';

    if (signupError) {
      html += '<p class="msg msg-duplicate" style="margin-top:8px;">' + escapeHtml(signupError) + '</p>';

    return html;

  if (pendingUndo) {

  }

  if (pendingSwitchUserConfirm) {
    html += '<div class="undo-toast"><span>You have an unsaved entry — sign out anyway and lose it?</span><button class="btn btn-ghost btn-small" id="switch-user-confirm-btn">Sign out anyway</button><button class="btn btn-ghost btn-small" id="switch-user-cancel-btn">Keep editing</button></div>';
  }

  if (lightboxKeys && lightboxKeys.length) {
    const currentSrc = photoCache[lightboxKeys[lightboxIndex]];
    html += '<div class="lightbox-overlay" id="lightbox-overlay" role="dialog" aria-label="Photo viewer" aria-modal="true">';
